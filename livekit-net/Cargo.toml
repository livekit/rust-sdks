[package]
name = "livekit-net"
version = "0.1.3"
license.workspace = true
description = "Pluggable, host-providable network transport for LiveKit signalling"
edition.workspace = true
repository.workspace = true

[features]
default = []

# UniFFI bindings: exposes the transport seam across the FFI so a host can
# implement WsClient/HttpClient and register it. Orthogonal to the native
# backends — enable alongside a native-* backend for a host-overridable
# transport that falls back to native.
uniffi = ["dep:uniffi"]

# Native backend bundle: the bundled websocket/HTTP stack. Without it the crate
# is transport-blind and the host must register a client.
native = ["dep:tokio-tungstenite", "dep:reqwest", "dep:tokio", "dep:futures-util", "dep:bytes", "dep:base64"]


# ── TLS (only meaningful with a native backend) ───────────────────
native-tls = [
    "tokio-tungstenite?/native-tls",
    "reqwest?/native-tls",
]
native-tls-vendored = [
    "tokio-tungstenite?/native-tls-vendored",
    "reqwest?/native-tls-vendored",
]
rustls-tls-native-roots = [
    "tokio-tungstenite?/rustls-tls-native-roots",
    "reqwest?/rustls-tls-native-roots",
    "tokio-tungstenite?/__rustls-tls",
    "dep:tokio-rustls",
    "dep:rustls-native-certs",
]
rustls-tls-webpki-roots = [
    "tokio-tungstenite?/rustls-tls-webpki-roots",
    "reqwest?/rustls-tls-webpki-roots",
]
__rustls-tls = ["tokio-tungstenite?/__rustls-tls", "reqwest?/__rustls"]

[dependencies]
async-trait = "0.1"

# Optional: scaffolding for the `uniffi` feature. `scaffolding-ffi-buffer-fns`
# matches livekit-datatrack/livekit-uniffi so the ABI is consistent when these
# crates are combined into one cdylib. No runtime feature: the exported traits
# are `with_foreign` (host-driven futures) and the exported setters are sync, so
# the crate stays runtime-agnostic.
uniffi = { workspace = true, features = ["scaffolding-ffi-buffer-fns"], optional = true }

url = "2.3"
http = "1.1"
log = { workspace = true }
tokio-tungstenite = { version = "0.29", features = ["url"], optional = true }
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "io-util", "net", "time", "rt-multi-thread"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
futures-util = { workspace = true, default-features = false, features = ["sink"], optional = true }
bytes = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
base64 = { version = "0.21", optional = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["url"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

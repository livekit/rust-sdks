[package]
name = "livekit-ffi"
version = "0.12.79"
edition.workspace = true
license.workspace = true
description = "FFI interface for bindings in other languages"
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = ["room-apis", "rustls-tls-native-roots"]

# There are two mutually exclusive modes that this crate can be configured
# in, `room-apis` and `core-modules`.

# `room-apis` implements a full, rust owned and managed webrtc stack. This is used by more modern
# client sdks like python, node, unity, and c++.
room-apis = [
  "dep:livekit",
  "dep:webrtc-sys",
  "dep:soxr-sys",
  "dep:imgproc",
  "dep:prost",
  "dep:dashmap",
  "dep:downcast-rs",
  "dep:env_logger",
  "dep:from_variants",
  "dep:lazy_static",
  "dep:parking_lot",
  "dep:prost-build",
  "dep:webrtc-sys-build",
  "tokio/full",
  "tokio/parking_lot",
]

# `core-modules` implements a set of smaller utility modules in rust to abstract away business
# logic. This does NOT include `libwebrtc` or `livekit`.
#
# This mode is used by older client sdks which historically were fully implemented in each
# downstream language and is a transitional step to migrating eventually someday to the full
# room-apis mode - swift, android, flutter, etc.
core-modules = [
  "dep:livekit-common",
  "dep:livekit-data-stream",
  "dep:livekit-datatrack",
  "dep:livekit-net",
  "dep:livekit-token",
  "dep:prost_012",
  "dep:async-trait",
  "dep:once_cell",
  "dep:tokio-util",
  "livekit-common/uniffi",
  "livekit-datatrack/uniffi",
  "livekit-net/uniffi",
  "uniffi/tokio",
]

# TLS selection. These imply `room-apis` because they only configure `livekit`:
# .github/workflows/ffi-builds.yml builds several targets with
# `--no-default-features --features "<tls>"`, which would otherwise select
# neither surface and produce an empty crate.
native-tls = ["room-apis", "livekit/native-tls"]
native-tls-vendored = ["room-apis", "livekit/native-tls-vendored"]
rustls-tls-native-roots = ["room-apis", "livekit/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["room-apis", "livekit/rustls-tls-webpki-roots"]
__rustls-tls = ["room-apis", "livekit/__rustls-tls"]

# Enable tokio-console to debug tasks
tracing = ["room-apis", "tokio/tracing", "dep:console-subscriber"]

# Capture sources (livekit-capture): publish tracks from server-side
# producers. This enables the capture scaffolding only; enable a
# `capture-*` feature to include a specific source.
capture = ["room-apis", "dep:livekit-capture"]
capture-clock = ["capture", "livekit-capture/source-clock"]
capture-pattern = ["capture", "livekit-capture/source-pattern"]

[dependencies]
# Shared by both surfaces.
livekit-protocol = { workspace = true }
uniffi = { workspace = true, features = ["scaffolding-ffi-buffer-fns"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }
futures-util = { workspace = true, default-features = false, features = ["sink"] }
bytes = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# room-apis only. Each of these is referenced solely from the `room_apis` module
# tree, so gating them costs no source changes.
livekit = { workspace = true, optional = true }
livekit-capture = { workspace = true, optional = true, default-features = false }

# core-modules only.
livekit-common = { workspace = true, optional = true }
livekit-token = { workspace = true, optional = true }
livekit-datatrack = { workspace = true, optional = true }
livekit-net = { workspace = true, optional = true }
livekit-data-stream = { workspace = true, optional = true }
tokio-util = { version = "0.7.18", optional = true }
once_cell = { version = "1.21.3", optional = true }
async-trait = { version = "0.1", optional = true }

# Referenced from no source file at all: webrtc-sys exists to link static
# libwebrtc, which build.rs wires up under the same feature.
webrtc-sys = { workspace = true, optional = true }
soxr-sys = { workspace = true, optional = true }
imgproc = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
parking_lot = { workspace = true, features = ["deadlock_detection"], optional = true }
lazy_static = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
dashmap = { version = "6.2", optional = true }
downcast-rs = { version = "1.2", optional = true }
from_variants = { version = "1.0.2", optional = true }
console-subscriber = { workspace = true, features = ["parking_lot"], optional = true }

# prost 0.12, alongside the 0.14 above. livekit-protocol and livekit-data-stream
# are on 0.12 and the core modules call `Message` on their generated types,
# while livekit-ffi's own protos are generated by prost-build 0.14 and emit
# `::prost::` paths, so that name has to stay bound to 0.14. The two surfaces
# are mutually exclusive, so the two versions never compile together.
#
# TODO: drop this once the workspace unifies on a single prost.
prost_012 = { package = "prost", version = "0.12", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
link-cplusplus = { version = "1", features = ["nothing"] }
device-info = { workspace = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
webrtc-sys-build = { workspace = true, optional = true }

[dev-dependencies]
livekit-token = { workspace = true }

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[package]
name = "livekit-ffi"
version = "0.16.0"
edition.workspace = true
license.workspace = true
description = "FFI interface for bindings in other languages"
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = ["room-apis", "rustls-tls-native-roots"]

# There are two mutually exclusive modes that this crate can be configured
# in, `room-apis` and `core-modules`.

# Internal. The code and the dependencies of the room surface, with no network
# stack selected. It exists because Cargo features only add: a build cannot
# subtract the bundled stack from `room-apis`, so the two room builds below
# share this base and each adds its own network choice. Every
# `cfg(feature = "__room-surface")` in the sources gates code that both room
# builds compile. Do not select it directly: without one of the two features
# below, the artifact has no network stack and exports no way to register one.
__room-surface = [
  "dep:livekit",
  "dep:webrtc-sys",
  "dep:soxr-sys",
  "dep:imgproc",
  # The typed surface exports the same access token helpers as `core-modules`.
  "dep:livekit-token",
  "dep:livekit-signaling", # typed SignalError causes from the authoritative room
  "dep:livekit-data-stream",
  "dep:prost",
  "dep:dashmap",
  "dep:downcast-rs",
  "dep:env_logger",
  "dep:from_variants",
  "dep:lazy_static",
  "dep:parking_lot",
  "dep:prost-build",
  "dep:webrtc-sys-build",
  "tokio/full",
  "tokio/parking_lot",
]

# `room-apis` implements a full, rust owned and managed webrtc stack. This is used by more modern
# client sdks like python, node, unity, and c++.
#
# `livekit/default` is listed because the `livekit` dependency below turns the
# default features of `livekit` off. That default is `native`: the bundled
# WebSocket and HTTP stack of livekit-net (tokio-tungstenite and reqwest). With
# this entry, `room-apis` resolves to the same packages and the same features
# as before the dependency changed.
room-apis = ["__room-surface", "livekit/default"]

# The same room surface as `room-apis`, but the host application supplies the
# network: the artifact contains no bundled WebSocket, HTTP or TLS client. It
# also exports the existing UniFFI interface of livekit-net (`WsClient`,
# `HttpClient`, `set_ws_client`, `set_http_client`), so the host registers its
# clients through generated bindings. WebRTC media stays in Rust.
#
# The host must register both clients before the first connect. Without them,
# connect fails with `NativeSignalFailure::TransportNotConfigured`. There is no
# fallback.
#
# Build it alone: `--no-default-features --features room-apis-host-transport`.
# It excludes `room-apis`, the TLS features and every other feature that
# implies `room-apis`, because each of them links the bundled stack again.
room-apis-host-transport = ["__room-surface", "dep:livekit-net", "livekit-net/uniffi"]

# `core-modules` implements a set of smaller utility modules in rust to abstract away business
# logic. This does NOT include `libwebrtc` or `livekit`.
#
# This mode is used by older client sdks which historically were fully implemented in each
# downstream language and is a transitional step to migrating eventually someday to the full
# room-apis mode - swift, android, flutter, etc.
core-modules = [
  "dep:livekit-data-stream",
  "dep:livekit-net",
  "dep:livekit-signaling",
  "dep:livekit-telemetry",
  "dep:livekit-token",
  "dep:prost",
  "dep:async-trait",
  "dep:once_cell",
  "livekit-net/uniffi",
  "livekit-telemetry/net",
  "livekit-telemetry/uniffi",
  "uniffi/tokio",
]

# TLS selection. These imply `room-apis` because they only configure `livekit`:
# .github/workflows/ffi-builds.yml builds several targets with
# `--no-default-features --features "<tls>"`, which would otherwise select
# neither surface and produce an empty crate.
native-tls = ["room-apis", "livekit/native-tls"]
native-tls-vendored = ["room-apis", "livekit/native-tls-vendored"]
rustls-tls-native-roots = ["room-apis", "livekit/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["room-apis", "livekit/rustls-tls-webpki-roots"]
__rustls-tls = ["room-apis", "livekit/__rustls-tls"]

# Enable tokio-console to debug tasks
tracing = ["room-apis", "tokio/tracing", "dep:console-subscriber"]

# Capture sources (livekit-capture): publish tracks from server-side
# producers. This enables the capture scaffolding only; enable a
# `capture-*` feature to include a specific source.
capture = ["room-apis", "dep:livekit-capture"]
capture-clock = ["capture", "livekit-capture/source-clock"]
capture-gstreamer = ["capture", "livekit-capture/source-gstreamer"]
capture-pattern = ["capture", "livekit-capture/source-pattern"]

# End-to-end tests against a LiveKit server, as in the `livekit` crate. These
# drive the room-apis request surface, so they imply it.
__lk-e2e-test = ["room-apis"]

[dependencies]
# Shared by both surfaces.
livekit-protocol = { workspace = true }
uniffi = { workspace = true, features = ["scaffolding-ffi-buffer-fns", "tokio"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }
futures-util = { workspace = true, default-features = false, features = ["sink"] }
bytes = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
livekit-common = { workspace = true, features = ["uniffi"] }
livekit-datatrack = { workspace = true, features = ["uniffi"] }
tokio-util = { workspace = true, features = ["rt"] }

# room-apis only. Each of these is referenced solely from the `room_apis` module
# tree, so gating them costs no source changes.
# A path dependency, not `workspace = true`: a member cannot turn off default
# features that the workspace entry leaves on, and the default of `livekit` is
# `native`. `room-apis` adds `livekit/default` back, and
# `room-apis-host-transport` leaves it off. No version is necessary, because
# this crate is not published.
livekit = { path = "../livekit", default-features = false, optional = true }
livekit-capture = { workspace = true, optional = true, default-features = false }

# Both surfaces: access tokens.
livekit-token = { workspace = true, optional = true }

# core-modules only, except livekit-net: `room-apis-host-transport` also
# selects it, for its UniFFI exports.
livekit-net = { workspace = true, optional = true }
livekit-telemetry = { workspace = true, optional = true }
livekit-data-stream = { workspace = true, optional = true }
# Default features, so the signalling client stays transport-blind and uses
# whatever the host registered with livekit-net.
livekit-signaling = { workspace = true, optional = true }
once_cell = { version = "1.21.3", optional = true }
async-trait = { version = "0.1", optional = true }

# Referenced from no source file at all: webrtc-sys exists to link static
# libwebrtc, which build.rs wires up under the same feature.
webrtc-sys = { workspace = true, optional = true }
soxr-sys = { workspace = true, optional = true }
imgproc = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
parking_lot = { workspace = true, features = ["deadlock_detection"], optional = true }
lazy_static = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
dashmap = { version = "6.2", optional = true }
downcast-rs = { version = "1.2", optional = true }
from_variants = { version = "1.0.2", optional = true }
console-subscriber = { workspace = true, features = ["parking_lot"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
link-cplusplus = { version = "1", features = ["nothing"] }
device-info = { workspace = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
webrtc-sys-build = { workspace = true, optional = true }

[dev-dependencies]
flate2 = "1"
livekit-token = { workspace = true }
serial_test = "3.0"

# Which FFI mode each downstream package build is configured to use: room-apis or core-modules.
#
# This is the single source of truth: CI and Makefile.toml resolve their build
# flags from here via .github/scripts/ffi_features.py, so a platform
# cannot silently drift onto the wrong surface. Every entry turns the default
# features off and lists the whole set it wants, so a change to `default`
# cannot move a platform onto another surface.
#
#     $ .github/scripts/ffi_features.py --list
#
# Every build site that produces an artifact names its platform and takes its
# flags from the row below, so adding a bindgen or a package means adding a
# row. The per-commit gates in builds.yml and tests.yml build no artifact for
# any platform and state their flags directly.
#
# `crate-type` (optional) can be included to define the type of library that gets
# built in a release workflow - this can be either `cdylib` or `staticlib`. For some
# builds (ie, node) it is omitted and the default option is used instead.
#
# For more info on why this is important, see: https://github.com/livekit/rust-sdks/pull/1631
#
[package.metadata.platform-features]
# room-apis -- SDKs with no WebRTC stack of their own. These consume the C ABI
# (and, increasingly, UniFFI) out of the livekit-ffi release archives.
python = { no-default-features = true, features = ["room-apis", "rustls-tls-native-roots"], crate-type = "cdylib" }
# No crate-type: node-builds.yml links livekit-ffi into livekit-ffi-node-bindings
# as an rlib dependency, so it never selects an output of its own.
node = { no-default-features = true, features = ["room-apis", "rustls-tls-native-roots"] }
unity = { no-default-features = true, features = ["room-apis", "rustls-tls-native-roots"], crate-type = "cdylib" }
ffi-desktop = { no-default-features = true, features = ["room-apis", "rustls-tls-native-roots"], crate-type = "cdylib" }
ffi-ios = { no-default-features = true, features = ["room-apis", "rustls-tls-webpki-roots"], crate-type = "staticlib" }
ffi-android = { no-default-features = true, features = ["room-apis", "rustls-tls-webpki-roots"], crate-type = "cdylib" }
ffi-windows-arm64 = { no-default-features = true, features = ["room-apis", "native-tls"], crate-type = "cdylib" } # ring 0.16 is incompatible with win aarch64

# core-modules -- SDKs that already include their own WebRTC stack and consume
# this crate purely over UniFFI.
# No crate-type: cargo-swift chooses the output itself, with --lib-type.
swift = { no-default-features = true, features = ["core-modules"] }
android = { no-default-features = true, features = ["core-modules"], crate-type = "cdylib" }
dart = { no-default-features = true, features = ["core-modules"], crate-type = "cdylib" }

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

syntax = "proto2";

package livekit.proto;
option csharp_namespace = "LiveKit.Proto";

import "handle.proto";
import "room.proto";
import "video_frame.proto";

// Capture sources (livekit-capture)
//
// A capture source owns a media producer (e.g. a GStreamer pipeline) and the
// pump that forwards its frames into an RTC video source, so no per-frame
// FFI traffic is needed. These requests are only served when the FFI server
// is built with the `capture` feature; otherwise they fail with an error.
//
// Usage:
// 1. NewCaptureSourceRequest (async): builds and starts the producer,
//    discovers stream settings, and returns an OwnedCaptureSource. Its info
//    embeds an OwnedVideoSource for the existing CreateVideoTrackRequest and
//    the recommended TrackPublishOptions for PublishTrackRequest.
// 2. StartCaptureRequest: starts pumping frames into the RTC source.
// 3. The capture runs until StopCaptureRequest, end of stream, or an error;
//    a CaptureSourceEvent is delivered exactly once when it ends.

// Bitrate unit expected by a GStreamer encoder property.
enum GstreamerBitrateUnit {
  GSTREAMER_BITRATE_UNIT_BPS = 0;
  GSTREAMER_BITRATE_UNIT_KBPS = 1;
}

// Binding from WebRTC rate-control targets to a GStreamer encoder property.
message GstreamerRateControl {
  // Name of the encoder element in the pipeline (e.g. `lk_encoder`).
  required string element = 1;
  // Bitrate property to set on the element (e.g. `bitrate` for x264enc,
  // `target-bitrate` for vp8enc/vp9enc).
  required string property = 2;
  // Unit the property expects.
  required GstreamerBitrateUnit unit = 3;
}

// Encoded ingest from a GStreamer pipeline.
message GstreamerVideoSourceConfig {
  // GStreamer launch description for the encoded producer pipeline.
  // Must contain `appsink name=lk_appsink`, or leave exactly one encoded
  // video source pad unlinked for the source to attach one to.
  required string pipeline = 1;
  // Codec expected from the pipeline; inferred from pipeline caps when
  // omitted.
  optional VideoCodec codec = 2;
  // Encoded frame resolution. When omitted, it is discovered from the
  // pipeline's negotiated caps; when set, the pipeline output is verified
  // against it.
  optional VideoSourceResolution resolution = 3;
  // Forwards WebRTC rate-control targets to an encoder element's bitrate
  // property. Without this, the pipeline encodes at a fixed bitrate.
  optional GstreamerRateControl rate_control = 4;
}

// Encoded ingest from an RTSP server over TCP-interleaved RTP.
message RtspVideoSourceConfig {
  // RTSP URL (rtsp://host[:port]/path, or rtsps:// when the server is built
  // with TLS support). URL userinfo is accepted and stripped from requests;
  // `username`/`password` take precedence over it.
  required string url = 1;
  // Username for RTSP authentication, overriding URL userinfo.
  optional string username = 2;
  // Password for RTSP authentication, overriding URL userinfo.
  optional string password = 3;
  // Codec required from the stream; the first supported video track offered
  // by the SDP is used when omitted.
  optional VideoCodec codec = 4;
  // Encoded frame resolution. When omitted, it is discovered from the SDP
  // when declared there, and from the stream's first keyframe otherwise;
  // when set, the first keyframe is verified against it.
  optional VideoSourceResolution resolution = 5;
  // TCP connect and RTSP handshake timeout in milliseconds (default 10000).
  optional uint32 connect_timeout_ms = 6;
  // Maximum tolerated stream silence in milliseconds (default 30000).
  optional uint32 idle_timeout_ms = 7;
  // Disables TLS certificate verification for rtsps:// URLs. Most cameras
  // present self-signed certificates, which fail verification against the
  // system roots. The connection stays encrypted but is not authenticated:
  // a network attacker could impersonate the camera.
  optional bool accept_invalid_tls_certs = 8;
}

// Test patterns built into livekit-capture.
enum Pattern {
  // Animated color gradient.
  PATTERN_GRADIENT = 0;
  // Bouncing LiveKit logo.
  PATTERN_LOGO = 1;
}

// Test pattern rendered on the GPU.
message PatternVideoSourceConfig {
  // Output resolution.
  required VideoSourceResolution resolution = 1;
  // Output frame rate in frames per second.
  required uint32 framerate_fps = 2;
  // Pattern to render.
  required Pattern pattern = 3;
}

// Wall clock with millisecond precision, rendered on the GPU. Shows the
// local time of the machine that runs the FFI server.
message ClockVideoSourceConfig {
  // Output resolution.
  required VideoSourceResolution resolution = 1;
  // Output frame rate in frames per second.
  required uint32 framerate_fps = 2;
}

// Frame format delivered by a capture device.
enum DeviceFrameFormat {
  DEVICE_FRAME_FORMAT_I420 = 0;
  DEVICE_FRAME_FORMAT_NV12 = 1;
  DEVICE_FRAME_FORMAT_BGRA = 2;
  DEVICE_FRAME_FORMAT_RGB24 = 3;
  DEVICE_FRAME_FORMAT_BGR24 = 4;
  DEVICE_FRAME_FORMAT_YUYV = 5;
  DEVICE_FRAME_FORMAT_UYVY = 6;
  DEVICE_FRAME_FORMAT_GREY = 7;
  DEVICE_FRAME_FORMAT_MJPEG = 8;
}

// Capture format offered by or requested from a device.
message DeviceFormat {
  // Frame dimensions.
  required VideoSourceResolution resolution = 1;
  // Frame rate in frames per second.
  required uint32 framerate_fps = 2;
  // Frame format.
  required DeviceFrameFormat frame_format = 3;
}

// Format selection requested from a capture device. The device negotiates
// the delivered format; CaptureSourceInfo reports the outcome.
message DeviceFormatRequest {
  // Prefer the highest frame rate, optionally constrained.
  message HighestFramerate {
    optional VideoSourceResolution resolution = 1;
    optional DeviceFrameFormat frame_format = 2;
  }
  // Prefer the highest resolution, optionally constrained.
  message HighestResolution {
    optional uint32 framerate_fps = 1;
    optional DeviceFrameFormat frame_format = 2;
  }
  // The device's default format when unset.
  oneof request {
    // Require an exact format match.
    DeviceFormat exact = 1;
    // Use the device's closest supported format.
    DeviceFormat closest = 2;
    HighestFramerate highest_framerate = 3;
    HighestResolution highest_resolution = 4;
  }
}

// Camera device capture using the platform's native capture stack.
message DeviceVideoSourceConfig {
  // Device to capture from; the platform default device when unset.
  oneof device {
    // Position in the platform enumeration order.
    uint32 device_index = 1;
    // Platform-stable identifier, as reported by CaptureDeviceInfo.id.
    string device_id = 2;
  }
  // Format requested from the device; the device default when unset.
  optional DeviceFormatRequest format = 3;
}

// Video capture device discovered by ListCaptureDevicesRequest.
message CaptureDeviceInfo {
  // Platform-stable device identifier.
  required string id = 1;
  // Human-readable device name.
  required string name = 2;
  // Device model identifier, when available.
  optional string model_id = 3;
  // Device manufacturer, when available.
  optional string manufacturer = 4;
  // Capture formats reported by the device.
  repeated DeviceFormat formats = 5;
  // Whether `formats` is a complete list; some platforms do not enumerate
  // formats up front.
  required bool formats_complete = 6;
}

message CaptureDeviceList { repeated CaptureDeviceInfo devices = 1; }

// List the video capture devices available on this machine.
//
// Completes asynchronously with a ListCaptureDevicesCallback: enumeration
// queries the platform capture stack and may block briefly.
message ListCaptureDevicesRequest { optional uint64 request_async_id = 1; }
message ListCaptureDevicesResponse { required uint64 async_id = 1; }
message ListCaptureDevicesCallback {
  required uint64 async_id = 1;
  oneof message {
    string error = 2;
    CaptureDeviceList devices = 3;
  }
}

// Kind of media a capture source produces.
enum CaptureSourceKind {
  // Pixel frames, published through the WebRTC encoder.
  CAPTURE_SOURCE_PIXEL = 0;
  // Pre-encoded access units, published as passthrough.
  CAPTURE_SOURCE_ENCODED = 1;
}

message CaptureSourceInfo {
  required CaptureSourceKind kind = 1;
  // Declared or discovered stream resolution.
  required VideoSourceResolution resolution = 2;
  // Codec produced by the source; encoded sources only.
  optional VideoCodec codec = 3;
  // Publish options derived from the source (codec, encoder backend, ...).
  // Merge application options (e.g. track source) over these when calling
  // PublishTrackRequest.
  required TrackPublishOptions recommended_publish_options = 4;
  // RTC video source fed by this capture source; pass its handle to
  // CreateVideoTrackRequest. Owned by the client like any other handle.
  required OwnedVideoSource video_source = 5;
}

message OwnedCaptureSource {
  required FfiOwnedHandle handle = 1;
  required CaptureSourceInfo info = 2;
}

// Create a new capture source from configuration.
//
// Completes asynchronously with a NewCaptureSourceCallback: construction
// starts the producer and may wait for its first output to discover stream
// settings.
message NewCaptureSourceRequest {
  oneof config {
    GstreamerVideoSourceConfig gstreamer = 1;
    PatternVideoSourceConfig pattern = 2;
    DeviceVideoSourceConfig device = 4;
    ClockVideoSourceConfig clock = 5;
    RtspVideoSourceConfig rtsp = 6;
  }
  optional uint64 request_async_id = 3;
}
message NewCaptureSourceResponse { required uint64 async_id = 1; }
message NewCaptureSourceCallback {
  required uint64 async_id = 1;
  oneof message {
    string error = 2;
    OwnedCaptureSource source = 3;
  }
}

// Start pumping frames from a capture source into its RTC video source.
message StartCaptureRequest { required uint64 capture_handle = 1; }
message StartCaptureResponse { optional string error = 1; }

// Signal a running capture to stop after the frame in flight. The terminal
// CaptureSourceEvent follows shortly. Stopping an already-finished capture
// is a no-op.
message StopCaptureRequest { required uint64 capture_handle = 1; }
message StopCaptureResponse { optional string error = 1; }

// Why a capture ended without error.
enum CaptureExit {
  // Stopped by StopCaptureRequest (or handle disposal).
  CAPTURE_EXIT_STOPPED = 0;
  // The producer reached the end of its stream.
  CAPTURE_EXIT_END_OF_STREAM = 1;
}

message CaptureFinished {
  required uint64 frames_captured = 1;
  required CaptureExit exit = 2;
}

message CaptureError { required string error = 1; }

// Delivered exactly once when a started capture ends, regardless of why
// (stop request, end of stream, or failure).
message CaptureSourceEvent {
  required uint64 capture_handle = 1;
  oneof message {
    CaptureFinished finished = 2;
    CaptureError error = 3;
  }
}

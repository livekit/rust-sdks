[package]
name = "livekit-runtime"
version = "0.4.0"
license.workspace = true
description = "Async runtime compatibility layer for LiveKit"
edition.workspace = true
repository.workspace = true

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
smol = ["dep:smol"]
# Deprecated. async-std is discontinued upstream ("`async-std` has been
# discontinued; use `smol` instead"), so enable `smol` for new work.
async = ["dep:async-std"]

[dependencies]
# The `Runtime` trait, `JoinHandle`, and the time helpers derived from
# `Runtime::sleep` are unconditional, so their deps must be too. `futures-channel`
# backs `JoinHandle` (a runtime-agnostic oneshot); `futures-core` is where the
# `Stream` re-export comes from -- both `tokio_stream::Stream` and
# `futures::Stream` are re-exports of that same trait.
futures-channel = { workspace = true }
futures-core = { workspace = true }

# Backends. Each needs only an executor and a timer: sockets are the transport's
# business, not the runtime's, so no backend pulls in a networking stack.
tokio = { workspace = true, default-features = false, optional = true, features = [
    "rt",
    "rt-multi-thread",
    "time",
] }
smol = { version = "2", optional = true }
async-std = { version = "1", optional = true }

[dev-dependencies]
# Drives futures in the flavor-agnostic test harness (tests/support/mod.rs).
futures-executor = "0.3"

[package]
name = "livekit-runtime"
version = "0.4.0"
license.workspace = true
description = "Async runtime compatibility layer for LiveKit"
edition.workspace = true
repository.workspace = true

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
async = ["dep:async-std", "dep:async-io"]
dispatcher = ["dep:async-std", "dep:async-task"]

[dependencies]
# The `Runtime` trait, `JoinHandle`, and the time helpers derived from
# `Runtime::sleep` are unconditional, so their deps must be too. `futures-channel`
# backs `JoinHandle` (a runtime-agnostic oneshot); `futures-core` is where the
# `Stream` re-export comes from -- both `tokio_stream::Stream` and
# `futures::Stream` are re-exports of that same trait.
futures-channel = { workspace = true }
futures-core = { workspace = true }

# tokio
tokio = { workspace = true, default-features = false, optional = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
] }

# async-std backend; also the source of `TcpStream` for the dispatcher backend.
async-std = { version = "1", optional = true }
async-io = { version = "2.3.1", optional = true }

# dispatcher
async-task = { version = "4.7.0", optional = true }

[dev-dependencies]
# Drives futures in the flavor-agnostic test harness (tests/support/mod.rs).
futures-executor = "0.3"

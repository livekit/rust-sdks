      additionalProperties: false
    livekit.SimulationRun.Create.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        agentName:
          type: string
          title: agent_name
        numSimulations:
          type: integer
          title: num_simulations
          format: int32
        region:
          type: string
          title: region
        scenarioGroup:
          oneOf:
            - $ref: '#/components/schemas/livekit.ScenarioGroup'
            - type: "null"
          title: scenario_group
          description: |-
            When set, run these scenarios (loaded from a scenarios.yaml).
             When unset, generate num_simulations scenarios from the uploaded agent source.
        concurrency:
          type:
            - integer
            - "null"
          title: concurrency
          format: int32
          description: |-
            Maximum simulate jobs running in parallel for this run. Clamped to the
             project's concurrency quota; 0/unset uses the server default.
        mode:
          title: mode
          description: Conversation mode for every job in this run; unspecified = TEXT.
          $ref: '#/components/schemas/livekit.SimulationMode'
        backgroundNoise:
          type: boolean
          title: background_noise
          description: Impairments applied to the simulated user's audio; AUDIO mode only.
        lowQualityMicrophone:
          type: boolean
          title: low_quality_microphone
        packetLoss:
          type: boolean
          title: packet_loss
        ci:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.CI'
            - type: "null"
          title: ci
        sampling:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.SamplingOptions'
            - type: "null"
          title: sampling
          description: |-
            Absent runs each scenario once and requires it to pass. Requires
             scenario_group. The run fails if any scenario fails; pass@k and
             pass^k report over scenarios and neither gates.
      title: Request
      additionalProperties: false
    livekit.SimulationRun.Create.Response:
      type: object
      properties:
        simulationRunId:
          type: string
          title: simulation_run_id

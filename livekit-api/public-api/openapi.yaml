          type: string
          title: project_id
        startTime:
          title: start_time
          description: |-
            Half-open window [start_time, end_time) on the run's creation time.
             Both are required and end_time must be after start_time.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endTime:
          title: end_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        status:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Status'
            - type: "null"
          title: status
          description: Only runs in this status.
        agentName:
          type:
            - string
            - "null"
          title: agent_name
          description: Only runs of this agent (exact name).
        mode:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
            - type: "null"
          title: mode
          description: Only runs in this conversation mode.
      title: Request
      additionalProperties: false
    livekit.publicapi.simulations.v1.SimulationRuns.Counts.Response:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/livekit.SimulationRun.Counts.Bucket'
          title: buckets
          description: |-
            Buckets holding at least one run, ascending by bucket_start. Empty
             buckets are omitted; each run lands in exactly one bucket, so the
             counts sum to the number of runs in the window.
        interval:
          title: interval
          description: |-
            The bucket width the service chose for the window (at most 60 buckets,
             never narrower than one minute), so a client zero-fills the omitted
             buckets on the grid the counts were built on.
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Response
      additionalProperties: false
    livekit.publicapi.simulations.v1.SimulationRuns.Create.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        agentName:
          type: string
          title: agent_name
          description: |-
            Name the agent under test is registered under; every job dispatches it
             into the simulation room, so it must already be deployed or running as
             a worker. Empty uses the project's default agent. Recorded on the run
             and usable as a ListSimulationRuns filter.
        numSimulations:
          type: integer
          title: num_simulations
          format: int32
          description: |-
            Number of scenarios to generate from the agent source when
             scenario_group is unset.
        region:
          type: string
          title: region
          description: 'Reserved: must be empty, and the service chooses where the run happens.'
        scenarioGroup:
          oneOf:
            - $ref: '#/components/schemas/livekit.ScenarioGroup'
            - type: "null"
          title: scenario_group
          description: |-
            Run exactly these scenarios (the contents of a scenarios.yaml) instead
             of generating num_simulations of them; the run then needs no source
             upload and starts immediately.
        concurrency:
          type:
            - integer
            - "null"
          title: concurrency
          format: int32
          description: |-
            Maximum jobs running in parallel, at most 20; above that the request is
             InvalidArgument. The project's concurrency quota can run fewer at once.
             Unset uses the server default.
        mode:
          title: mode
          description: Conversation mode for every job; unspecified means TEXT.
          $ref: '#/components/schemas/livekit.SimulationMode'
        backgroundNoise:
          type: boolean
          title: background_noise
          description: Audio impairments applied to the simulated user; AUDIO mode only.
        lowQualityMicrophone:
          type: boolean
          title: low_quality_microphone
        packetLoss:
          type: boolean
          title: packet_loss
        ci:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.CI'
            - type: "null"
          title: ci
          description: |-
            The CI pipeline this run came from, so runs can be linked back to
             commits.
      title: Request
      additionalProperties: false
    livekit.publicapi.simulations.v1.SimulationRuns.Create.Response:

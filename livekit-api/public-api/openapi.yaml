              type: boolean
              title: disable_manifest
              description: disable upload of manifest file (default false)
        - oneOf:
            - type: object
              properties:
                aliOSS:
                  title: aliOSS
                  $ref: '#/components/schemas/livekit.AliOSSUpload'
              title: aliOSS
              required:
                - aliOSS
            - type: object
              properties:
                azure:
                  title: azure
                  $ref: '#/components/schemas/livekit.AzureBlobUpload'
              title: azure
              required:
                - azure
            - type: object
              properties:
                gcp:
                  title: gcp
                  $ref: '#/components/schemas/livekit.GCPUpload'
              title: gcp
              required:
                - gcp
            - type: object
              properties:
                s3:
                  title: s3
                  $ref: '#/components/schemas/livekit.S3Upload'

    livekit.SimulationRun.List:
      type: object
      title: List
      additionalProperties: false
    livekit.SimulationRun.List.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        status:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Status'
            - type: "null"
          title: status
        pageToken:
          oneOf:
            - $ref: '#/components/schemas/livekit.TokenPagination'
            - type: "null"
          title: page_token
        startTime:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: start_time
          description: |-
            Half-open window [start_time, end_time) on created_at, the leading key
             of this list's keyset. Unset bounds mean no window, so existing callers
             keep their unbounded scan; the histogram's selected range sets both.
        endTime:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: end_time
        agentName:
          type:
            - string
            - "null"
          title: agent_name
          description: |-
            Exact agent name. Unset means every agent — including the runs whose
             name is empty, which a bare string could not tell from no filter.
        mode:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
            - type: "null"
          title: mode
          description: |-
            Absent applies no mode filter. TEXT matches runs stored as TEXT or
             UNSPECIFIED, which `SimulationRun.mode` defines as the same mode.
      title: Request
      additionalProperties: false
    livekit.SimulationRun.List.Response:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/livekit.SimulationRun'
          title: runs
        nextPageToken:
          title: next_page_token
          $ref: '#/components/schemas/livekit.TokenPagination'
      title: Response
      additionalProperties: false

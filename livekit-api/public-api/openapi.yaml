             from the beginning.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: Maximum items to return; 0 lets the server pick a default.
          schema:
            type: integer
            title: page_size
            format: int32
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.observability.v1.Traces.Get.Response'
  /v0/projects/{projectId}/sessions/{sessionId}/transcript:
    get:
      tags:
        - livekit.publicapi.observability.v1.ObservabilityService
      summary: |-
        GetSessionTranscript returns the session's conversation as ordered
         transcript items: messages, tool calls and results, agent handoffs and
         agent configuration changes. It is the conversation the dashboard's
         transcript shows.
      description: |-
        The agent exports its transcript when the session ends, and it can be
         read a minute or two later; on a project with PII redaction, only once
         the session's recording has been redacted. So a session that is still
         ACTIVE returns what exists so far, usually nothing, without an error:
         read it again after the session ends. An unknown session is NotFound.
      operationId: ObservabilityService_GetSessionTranscript
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            title: project_id
        - name: sessionId
          in: path
          description: The session's RM_ id.
          required: true
          schema:
            type: string
            title: session_id
        - name: page.cursor
          in: query
          description: |-
            Opaque cursor returned by a prior page (PageInfo.next_cursor). Empty starts
             from the beginning.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: Maximum items to return; 0 lets the server pick a default.
          schema:
            type: integer
            title: page_size
            format: int32
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.observability.v1.Transcript.Get.Response'

    livekit.SimulationRun.Counts:
      type: object
      title: Counts
      additionalProperties: false
      description: |-
        Counts of the runs `List` would return over the same window, bucketed by
         created_at instead of paginated.
    livekit.SimulationRun.Counts.Bucket:
      type: object
      properties:
        bucketStart:
          title: bucket_start
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        count:
          type:
            - integer
            - string
          title: count
          format: int64
      title: Bucket
      additionalProperties: false
    livekit.SimulationRun.Counts.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        startTime:
          title: start_time
          description: |-
            Both bounds required: a bucketed scan of a project's whole history is
             never what a caller wants.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endTime:
          title: end_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        status:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Status'
            - type: "null"
          title: status
          description: |-
            Applied as `List` applies it: a filter the rows honour and the bars
             above them drop would make the histogram an answer about a wider set.
        agentName:
          type:
            - string
            - "null"
          title: agent_name
        mode:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
            - type: "null"
          title: mode
      title: Request
      additionalProperties: false
    livekit.SimulationRun.Counts.Response:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/livekit.SimulationRun.Counts.Bucket'
          title: buckets
          description: |-
            Buckets holding at least one run, ascending by bucket_start. Empty
             buckets are omitted; each run lands in exactly one bucket, so the
             counts sum to the number of runs in the window.
        interval:
          title: interval
          description: |-
            The bucket width the server chose from the window, so the client
             zero-fills the omitted buckets on the grid the counts were built on.
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Response
      additionalProperties: false
    livekit.SimulationRun.Create:
      type: object

tags:
  - name: livekit.publicapi.analytics.v1.AnalyticsService
    description: |-
      AnalyticsService is the project-scoped, typed analytics surface (READ tier).
       It exposes the same data the LiveKit Cloud dashboard renders, mapped into
       stable typed messages: room sessions and their participants/events, and
       pre-derived project/agent statistics sourced from the aggregator.

       Each operation's request and response are namespaced under a page-shaped
       parent message (Sessions, SessionParticipants, SessionEvents, ProjectOverview,
       Agents) so the top-level surface stays legible. The returned data shapes
       (Session, SessionDetail, ParticipantInfo, AgentAnalytics, ...) are top-level
       and shared.

       Raw per-session observability (transcripts, logs, traces, metrics,
       recordings) is NOT here — it lives in the ObservabilityService in
       livekit.publicapi.observability.v1, gated at the ADMIN tier.

       Authorization mirrors cloud-api-server: these reads require project READ.
  - name: livekit.publicapi.databases.v1.DatabaseService
    description: |-
      DatabaseService manages a project's agent databases: SQLite databases an
       agent keeps across sessions, stored durably by agent-db in the project's data
       region. Queries do not go through this service: they run over the WebSocket
       data plane at /v0/agentstore/db.

       Authorization: a LiveKit access token for the project with the agent
       databaseAdmin grant, or a user with project READ (Get, List, Export) or WRITE
       (Create, Delete).
  - name: livekit.publicapi.observability.v1.ObservabilityService
    description: |-
      ObservabilityService serves raw per-session observability data. Sessions are
       identified by their room-session id (RM_...), the same id AnalyticsService
       returns as `session_id`.
  - name: livekit.publicapi.projects.v1.ProjectService
    description: ProjectService is the projects domain of the public API.
  - name: livekit.publicapi.simulations.v1.SimulationService
    description: |-
      SimulationService runs agent simulations against a project's agent and
       returns their graded outcomes. Each job puts a simulated user in a room with
       the agent under test, dispatched by agent_name, so that agent must be
       deployed or running as a worker before the run starts.

       Runs are asynchronous. CreateSimulationRun returns a run id and runs in one
       of two ways:
         - With a scenario_group, the run starts immediately (RUNNING) and plays
           exactly those scenarios.
         - Without one, the service generates num_simulations scenarios from the
           agent's source: the run waits in PENDING_UPLOAD for the source to be
           uploaded to the returned presigned POST and confirmed with
           ConfirmSimulationSourceUpload, then goes GENERATING, then RUNNING. The
           source is only read to write scenarios; it is not the agent under test.
       Read the outcome back with GetSimulationRun and GetSimulationRunSummary.

       Authorization: reads (Get, List, GetSummary) require project READ; writes
       (Create, ConfirmSourceUpload, Cancel, GenerateScenarioFromSession) require
       project WRITE. A project the caller cannot see is NotFound; a project the
       caller can see but lacks the role for is PermissionDenied.
  - name: livekit.publicapi.threads.v1.ThreadService
    description: |-
      ThreadService manages a project's agent threads: the durable conversation an
       agent has with a person across channels and over time, named by its "AT_" id.
       Each thread has its own database, created with it.

       Authorization: a LiveKit access token for the project whose agentThread grant
       allows the action (list and create by scope; get, items, tasks and delete by
       thread id; any thread with all), or a user with project READ (Get, List,
       items, tasks) or WRITE (everything else).
  - name: livekit.publicapi.users.v1.UserService
    description: UserService is the users domain of the public API.
  - name: livekit.publicapi.workspaces.v1.WorkspaceService
    description: WorkspaceService is the workspaces domain of the public API.

    post:
      tags:
        - livekit.publicapi.simulations.v1.SimulationService
      summary: CreateSimulationRun
      description: |-
        CreateSimulationRun registers a new run. With a scenario_group it starts
         right away and no upload target is returned. Without one it waits in
         PENDING_UPLOAD for the agent source that scenarios are generated from:
         upload it to the returned presigned POST, then call
         ConfirmSimulationSourceUpload. A run left pending for an hour is failed.
         Creating a run is not idempotent: a retried request starts a second run.
      operationId: SimulationService_CreateSimulationRun
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            title: project_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agentName:
                  type: string
                  title: agent_name
                  description: |-
                    Name the agent under test is registered under; every job dispatches it
                     into the simulation room, so it must already be deployed or running as
                     a worker. Empty uses the project's default agent. Recorded on the run
                     and usable as a ListSimulationRuns filter.
                numSimulations:
                  type: integer
                  title: num_simulations
                  format: int32
                  description: |-
                    Number of scenarios to generate from the agent source when
                     scenario_group is unset.
                region:
                  type: string
                  title: region
                  description: 'Reserved: must be empty, and the service chooses where the run happens.'
                scenarioGroup:
                  oneOf:
                    - $ref: '#/components/schemas/livekit.ScenarioGroup'
                    - type: "null"
                  title: scenario_group
                  description: |-
                    Run exactly these scenarios (the contents of a scenarios.yaml) instead
                     of generating num_simulations of them; the run then needs no source
                     upload and starts immediately.
                concurrency:
                  type:
                    - integer
                    - "null"
                  title: concurrency
                  format: int32
                  description: |-
                    Maximum jobs running in parallel, at most 20; above that the request is
                     InvalidArgument. The project's concurrency quota can run fewer at once.
                     Unset uses the server default.
                mode:
                  title: mode
                  description: Conversation mode for every job; unspecified means TEXT.
                  $ref: '#/components/schemas/livekit.SimulationMode'
                backgroundNoise:
                  type: boolean
                  title: background_noise
                  description: Audio impairments applied to the simulated user; AUDIO mode only.
                lowQualityMicrophone:
                  type: boolean
                  title: low_quality_microphone
                packetLoss:
                  type: boolean
                  title: packet_loss
                ci:
                  oneOf:
                    - $ref: '#/components/schemas/livekit.SimulationRun.CI'
                    - type: "null"
                  title: ci
                  description: |-
                    The CI pipeline this run came from, so runs can be linked back to
                     commits.
              title: Request
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.Create.Response'
  /v0/projects/{projectId}/simulation-runs/{simulationRunId}:
    get:
      tags:
        - livekit.publicapi.simulations.v1.SimulationService
      summary: GetSimulationRun
      description: |-
        GetSimulationRun returns one run with its jobs and aggregate metrics. The
         compressed summary blob (summary_zstd) is omitted; use
         GetSimulationRunSummary for the decoded summary.
      operationId: SimulationService_GetSimulationRun
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            title: project_id
        - name: simulationRunId
          in: path
          required: true
          schema:
            type: string
            title: simulation_run_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.Get.Response'
  /v0/projects/{projectId}/simulation-runs/{simulationRunId}/summary:
    get:
      tags:
        - livekit.publicapi.simulations.v1.SimulationService
      summary: GetSimulationRunSummary
      description: |-
        GetSimulationRunSummary returns the graded outcome of a finished run:
         pass/fail counts, what went well, what to improve, flagged issues with
         suggestions, and the per-job chat history. FailedPrecondition while the
         run is still going; NotFound if the run finished without a summary.
      operationId: SimulationService_GetSimulationRunSummary
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            title: project_id
        - name: simulationRunId
          in: path
          required: true
          schema:
            type: string
            title: simulation_run_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.GetSummary.Response'
  /v0/projects/{projectId}/simulation-runs/{simulationRunId}:cancel:
    post:
      tags:
        - livekit.publicapi.simulations.v1.SimulationService
      summary: CancelSimulationRun
      description: |-
        CancelSimulationRun stops a run that has not finished. Cancelling a run
         that already finished succeeds without effect.
      operationId: SimulationService_CancelSimulationRun
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            title: project_id
        - name: simulationRunId
          in: path
          required: true
          schema:
            type: string
            title: simulation_run_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.Cancel.Response'
  /v0/projects/{projectId}/simulation-runs/{simulationRunId}:confirmSourceUpload:
    post:
      tags:
        - livekit.publicapi.simulations.v1.SimulationService
      summary: ConfirmSimulationSourceUpload
      description: |-
        ConfirmSimulationSourceUpload marks the agent source as uploaded and starts
         scenario generation; the run moves to GENERATING, then RUNNING once the
         scenarios exist. Only valid while the run is PENDING_UPLOAD, so a repeated
         call fails.
      operationId: SimulationService_ConfirmSimulationSourceUpload
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            title: project_id
        - name: simulationRunId
          in: path
          required: true
          schema:
            type: string
            title: simulation_run_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codeEntrypoint:
                  type: string
                  title: code_entrypoint
                  description: Entrypoint of the uploaded source, for example "agent.py".
              title: Request
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.ConfirmSourceUpload.Response'

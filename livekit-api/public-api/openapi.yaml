            - string
          title: turns
          format: int64
        latency:
          title: latency
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.LatencyBreakdown'
        joinLatency:
          title: join_latency
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.Percentiles'
      title: Performance
      additionalProperties: false
    livekit.publicapi.analytics.v1.AgentAnalytics.Sessions:
      type: object
      properties:
        total:
          type:
            - integer
            - string
          title: total
          format: int64
        active:
          type:
            - integer
            - string
          title: active
          format: int64
        dispatchErrors:
          type:
            - integer
            - string
          title: dispatch_errors
          format: int64
        estimate:
          title: estimate
          description: Set when `total` is an approximation; carries its tolerance.
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.Estimate'
      title: Sessions
      additionalProperties: false
    livekit.publicapi.analytics.v1.AgentAnalytics.Usage:
      type: object
      properties:
        avgTokensPerSession:
          type:
            - integer
            - string
          title: avg_tokens_per_session
          format: int64
        models:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ModelUsage'
          title: models
      title: Usage
      additionalProperties: false
    livekit.publicapi.analytics.v1.Agents.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        agentId:
          type: string
          title: agent_id
        range:
          title: range
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.TimeRange'
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.Agents.Get.Response:
      type: object
      properties:
        analytics:
          title: analytics
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.AgentAnalytics'
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.Agents.List.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        range:
          title: range
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.TimeRange'
        page:
          title: page
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.Agents.List.Response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.AgentAnalytics'
          title: items
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.CountryCount:
      type: object
      properties:
        name:
          type: string
          title: name
        count:
          type:
            - integer
            - string
          title: count
          format: int64
      title: CountryCount
      additionalProperties: false
      description: CountryCount is a per-country connection count for the top-countries breakdown.
    livekit.publicapi.analytics.v1.DataPoint:
      type: object
      properties:
        timestamp:
          title: timestamp
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        value:
          type: number
          title: value
          format: double
      title: DataPoint
      additionalProperties: false
      description: DataPoint is one point of a per-session time series (quality, bandwidth, fps).
    livekit.publicapi.analytics.v1.Estimate:
      type: object
      properties:
        isEstimate:
          type: boolean
          title: is_estimate
        errorMargin:
          type: number
          title: error_margin
          format: double
          description: Fractional tolerance (e.g. 0.01 for +/-1%). Zero when unknown.
      title: Estimate
      additionalProperties: false
      description: |-
        Estimate flags a value that is approximate over large windows, with its
         tolerance. A consumer should not treat an estimated value as exact.
    livekit.publicapi.analytics.v1.LatencyBreakdown:
      type: object
      properties:
        sttDelayMs:
          type: number
          title: stt_delay_ms
          format: double
        eouMs:
          type: number
          title: eou_ms
          format: double
        llmTtftMs:
          type: number
          title: llm_ttft_ms
          format: double
        ttsTtfbMs:
          type: number
          title: tts_ttfb_ms
          format: double
        avgReplyMs:
          type: number
          title: avg_reply_ms
          format: double
      title: LatencyBreakdown
      additionalProperties: false
      description: LatencyBreakdown is where an average agent reply's time goes, in milliseconds.
    livekit.publicapi.analytics.v1.ModelUsage:
      type: object
      properties:
        provider:
          type: string
          title: provider
        model:
          type: string
          title: model
        component:
          type: string
          title: component
        requests:
          type:
            - integer
            - string
          title: requests
          format: int64
        sessions:
          type:
            - integer
            - string
          title: sessions
          format: int64
        latencyP50Ms:
          type: number
          title: latency_p50_ms
          format: double
        latencyP95Ms:
          type: number
          title: latency_p95_ms
          format: double
        inTokens:
          type:
            - integer
            - string
          title: in_tokens
          format: int64
        outTokens:
          type:
            - integer
            - string
          title: out_tokens
          format: int64
        cachedTokens:
          type:
            - integer
            - string
          title: cached_tokens
          format: int64
        ttsChars:
          type:
            - integer
            - string
          title: tts_chars
          format: int64
      title: ModelUsage
      additionalProperties: false
      description: |-
        ModelUsage is per-model usage over the window. `component` is the stage the
         model served (llm, tts, realtime); latency is TTFT for llm/realtime rows and
         TTFB for tts rows.
    livekit.publicapi.analytics.v1.ParticipantInfo:
      type: object
      properties:
        participantIdentity:
          type: string
          title: participant_identity
        participantName:
          type: string
          title: participant_name
        joinedAt:
          title: joined_at
          description: First join across the identity's connections.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        leftAt:
          title: left_at
          description: |-
            Last leave across the identity's connections; unset while no leave is
             recorded, so a participant of an active session with no left_at may still
             be connected.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        publishedSources:
          title: published_sources
          description: Which track sources the participant published during the session.
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.PublishedSources'
        location:
          type: string
          title: location
          description: Country name, e.g. "United States"; "Unknown" when the rollup has none.
        region:
          type: string
          title: region
          description: LiveKit region display name; "Unknown" when the region isn't recognized.
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ParticipantSession'
          title: sessions
          description: |-
            The participant's participant sessions, oldest join first: one per
             connection, so each reconnect adds one. At most 50: a participant that
             reconnected more often has its oldest 50 here. Empty when they couldn't be
             read; the rest of the row still returns.
      title: ParticipantInfo
      additionalProperties: false
      description: |-
        ParticipantInfo is one participant identity of a room session, as the
         dashboard's participants table shows it.
    livekit.publicapi.analytics.v1.ParticipantSession:
      type: object
      properties:
        participantSessionId:
          type: string
          title: participant_session_id
          description: The participant session id (PA_...).
        joinedAt:
          title: joined_at
          description: When this participant session joined.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        leftAt:
          title: left_at
          description: When it left; unset while no leave is recorded.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        durationSeconds:
          type:
            - integer
            - string
          title: duration_seconds
          format: int64
          description: |-
            Seconds from joined_at to left_at, as the dashboard counts them. While no
             leave is recorded, to the session's end once it has one, else to now.
        location:
          type: string
          title: location
          description: Country name, e.g. "United States"; "Unknown" when the rollup has none.
        region:
          type: string
          title: region
          description: LiveKit region display name; "Unknown" when the region isn't recognized.
        connectionType:
          type: string
          title: connection_type
          description: |-
            Transport the client connected over: "UDP", "TCP" or "TURN"; empty when
             not reported.
        connectionTimeMs:
          type: integer
          title: connection_time_ms
          format: int32
          description: Milliseconds the client took to connect.
        deviceModel:
          type: string
          title: device_model
          description: Client device model, e.g. "iPhone 15".
        os:
          type: string
          title: os
          description: |-
            Client operating system: "ios", "android", "windows", "mac" or "linux";
             empty when not reported.
        browser:
          type: string
          title: browser
          description: Client browser, e.g. "chrome".
        sdkVersion:
          type: string
          title: sdk_version
          description: LiveKit client SDK version, e.g. "2.6.1". The SDK's name isn't recorded.
      title: ParticipantSession
      additionalProperties: false
      description: |-
        ParticipantSession is one participant session of a participant: one
         join-to-leave stretch, identified by its participant session id (PA_...),
         with the client it connected from. A participant that reconnects, from the
         same device or another, has several.
    livekit.publicapi.analytics.v1.ParticipantSortField:
      type: string
      title: ParticipantSortField
      enum:
        - PARTICIPANT_SORT_FIELD_UNSPECIFIED
        - PARTICIPANT_SORT_FIELD_JOINED_AT
        - PARTICIPANT_SORT_FIELD_LEFT_AT
      description: ParticipantSortField is the column a participant listing is ordered by.
    livekit.publicapi.analytics.v1.Percentiles:
      type: object
      properties:
        p50Ms:
          type: number
          title: p50_ms
          format: double
        p90Ms:
          type: number
          title: p90_ms
          format: double
        p99Ms:
          type: number
          title: p99_ms
          format: double
      title: Percentiles
      additionalProperties: false
      description: Percentiles is a p50/p90/p99 triple in milliseconds.
    livekit.publicapi.analytics.v1.PlatformShare:
      type: object
      properties:
        name:
          type: string
          title: name
        share:
          type: number
          title: share
          format: double
      title: PlatformShare
      additionalProperties: false
      description: PlatformShare is a per-platform share of connections (fraction 0..1).
    livekit.publicapi.analytics.v1.ProjectAnalytics:
      type: object
      properties:
        sessions:
          title: sessions
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ProjectAnalytics.Sessions'
        participants:
          title: participants
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ProjectAnalytics.Participants'
      title: ProjectAnalytics
      additionalProperties: false
      description: |-
        ProjectAnalytics is the project overview over a time range, grouped the same
         way: `sessions` and `participants`.
    livekit.publicapi.analytics.v1.ProjectAnalytics.Participants:
      type: object
      properties:
        total:
          type:
            - integer
            - string
          title: total
          format: int64
        topCountries:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.CountryCount'
          title: top_countries
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.PlatformShare'
          title: platforms
      title: Participants
      additionalProperties: false
    livekit.publicapi.analytics.v1.ProjectAnalytics.Sessions:
      type: object
      properties:
        served:
          type:
            - integer
            - string
          title: served
          format: int64
        withAgents:
          type:
            - integer
            - string
          title: with_agents
          format: int64
        withTelephony:
          type:
            - integer
            - string
          title: with_telephony
          format: int64
        avgDurationSeconds:
          type: number
          title: avg_duration_seconds
          format: double
        agentMinutes:
          type:
            - integer
            - string
          title: agent_minutes
          format: int64
      title: Sessions
      additionalProperties: false
    livekit.publicapi.analytics.v1.ProjectOverview.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        range:
          title: range
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.TimeRange'
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.ProjectOverview.Get.Response:
      type: object
      properties:
        analytics:
          title: analytics
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ProjectAnalytics'
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.PublishedSources:
      type: object
      properties:
        cameraTrack:
          type: boolean
          title: camera_track
        microphoneTrack:
          type: boolean
          title: microphone_track
        screenShareTrack:
          type: boolean
          title: screen_share_track
        screenShareAudio:
          type: boolean
          title: screen_share_audio
      title: PublishedSources
      additionalProperties: false
      description: PublishedSources is which track sources a participant published.
    livekit.publicapi.analytics.v1.Session:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        roomName:
          type: string
          title: room_name
        status:
          title: status
          description: |-
            ACTIVE until the session's close is recorded, so a session that stopped
             reporting can be ACTIVE with an ended_at.
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionStatus'
        startedAt:
          title: started_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endedAt:
          title: ended_at
          description: |-
            When the session ended. A session that stopped reporting is given its last
             report time, even while its status is still ACTIVE; unset while it is live.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        numParticipants:
          type: integer
          title: num_participants
          format: int32
          description: |-
            Distinct participants (by identity) connected for more than zero seconds
             during the session. Not a live count: a closed session keeps its total.
        tags:
          type: array
          items:
            type: string
          title: tags
        hasDetailData:
          type: boolean
          title: has_detail_data
          description: |-
            False while the session's full detail (end time, participant counts,
             duration) is still being finalized; the detail endpoints are complete once
             it is true.
        lastActive:
          title: last_active
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Session
      additionalProperties: false
      description: |-
        Session is one room-session list row. Bandwidth and connection time are on
         GetSession's detail only.
    livekit.publicapi.analytics.v1.SessionDetail:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        roomName:
          type: string
          title: room_name
        status:
          title: status
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionStatus'
        startedAt:
          title: started_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endedAt:
          title: ended_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        numParticipants:
          type: integer
          title: num_participants
          format: int32
          description: Same count as Session.num_participants.
        bandwidthIn:
          type:
            - integer
            - string
          title: bandwidth_in
          format: int64
          description: Bytes participants published, all track types.
        bandwidthOut:
          type:
            - integer
            - string
          title: bandwidth_out
          format: int64
          description: Bytes participants subscribed to, all track types.
        connectionSeconds:
          type:
            - integer
            - string
          title: connection_seconds
          format: int64
          description: |-
            WebRTC connection time in seconds, summed over standard participants and
             self-hosted agents (cloud agents excluded), as the dashboard counts it.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ParticipantInfo'
          title: participants
          description: |-
            The first page of participants, newest join first (at most 50). When
             participants_page.has_more, continue with ListSessionParticipants: pass
             participants_page.next_cursor as page.cursor, with sort_by and sort_order
             unset (or joined_at descending, the same thing).
        quality:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.DataPoint'
          title: quality
          description: Average connection quality as a 0-1 fraction of the 0-5 track score.
        publishBps:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.DataPoint'
          title: publish_bps
          description: Published audio plus video bitrate, in bits per second.
        subscribeBps:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.DataPoint'
          title: subscribe_bps
          description: Subscribed audio plus video bitrate, in bits per second.
        publishFps:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.DataPoint'
          title: publish_fps
          description: Published video frame rate.
        subscribeFps:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.DataPoint'
          title: subscribe_fps
          description: Subscribed video frame rate.
        tags:
          type: array
          items:
            type: string
          title: tags
          description: The session's tags, as on Session.
        participantsPage:
          title: participants_page
          description: |-
            Paging state for participants. Unset when the first page couldn't be
             read: the rest of the detail still returns, and ListSessionParticipants
             lists the participants.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: SessionDetail
      additionalProperties: false
      description: |-
        SessionDetail is the richer per-session view: a superset of Session with the
         room id, totals, the first page of participants, and per-metric timelines.
         The timelines share one grid sized from the session's length, the
         dashboard's: one point per bucket, 0 where a bucket has no data.
    livekit.publicapi.analytics.v1.SessionEvent:
      type: object
      properties:
        participantIdentity:
          type: string
          title: participant_identity
          description: |-
            The identity of the participant the event is about; empty for a room
             event, or an API call that names no participant.
        type:
          type: string
          title: type
          description: The event's type, an AnalyticsEventType name such as PARTICIPANT_JOINED.
        timestamp:
          title: timestamp
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        payload:
          title: payload
          description: |-
            The event's fields from an allowlist, each present only when the event
             has it:
               - participant events: participantKind, disconnectReason,
                 reconnectReason, isMigration and connectionType;
               - track events: trackId, trackType, trackSource, mimeType and muted;
               - ROOM_ENDED: reason;
               - API_CALL: service, method, status, twirpErrorCode and durationNs.
             Every other field the event recorded is left out.
          $ref: '#/components/schemas/google.protobuf.Struct'
        participantSessionId:
          type: string
          title: participant_session_id
          description: |-
            The participant session (PA_...) the event is about; empty when
             participant_identity is.
      title: SessionEvent
      additionalProperties: false
      description: |-
        SessionEvent is one event of a room session, such as a participant joining
         or a track being published.
    livekit.publicapi.analytics.v1.SessionEvents.List.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
        page:
          title: page
          description: |-
            page_size counts events, 50 by default and at most 100. A page can
             hold fewer events than its size, and the last full page can be
             followed by an empty one. A cursor pages only a request with the same
             types, participant_session_id and sort_order.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
        types:
          type: array
          items:
            type: string
          title: types
          description: |-
            Event types to return, by name, such as TRACK_PUBLISHED: the names of
             LiveKit's AnalyticsEventType. Each matches exactly. Empty returns the
             dashboard's seven defaults, or with participant_session_id its eleven
             participant defaults, track events included (see ListSessionEvents).
             An unknown name is InvalidArgument.
        participantSessionId:
          type: string
          title: participant_session_id
          description: |-
            Only the events of this participant session (PA_...), as the
             participants list's ParticipantSession.participant_session_id names
             it. Room events and API calls name no participant session, so they
             are left out. Anything but a PA_ id is InvalidArgument.
        sortOrder:
          title: sort_order
          description: |-
            Direction of the timestamp ordering. Defaults to ascending (oldest
             first) when unset.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.SortOrder'
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.SessionEvents.List.Response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionEvent'
          title: items
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.SessionFilter:
      type: object
      properties:
        range:
          title: range
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.TimeRange'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionStatus'
          title: statuses
          description: OR semantics; empty matches any status.
        roomName:
          type: string
          title: room_name
          description: |-
            Room-name prefix match (case-sensitive): returns sessions whose room name
             starts with this value, e.g. `demo-` matches `demo-1` and `demo-lobby`.
        sessionId:
          type: string
          title: session_id
          description: Exact room-session id match (RM_...).
        tags:
          type: array
          items:
            type: string
          title: tags
          description: OR semantics.
        agentId:
          type: string
          title: agent_id
          description: Cloud agent id (CA_...) — return only sessions this agent served. Duration is not filterable in v1.
      title: SessionFilter
      additionalProperties: false
      description: |-
        SessionFilter narrows a session listing. Only these fields are filterable
         upstream (the rest are rollup-stage values that would break keyset paging).
    livekit.publicapi.analytics.v1.SessionParticipants.List.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
        page:
          title: page
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
        sortBy:
          title: sort_by
          description: Column to order by. Defaults to joined_at when unset.
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ParticipantSortField'
        sortOrder:
          title: sort_order
          description: Direction of sort_by. Defaults to descending (newest first) when unset.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.SortOrder'
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.SessionParticipants.List.Response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.ParticipantInfo'
          title: items
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.SessionStatus:
      type: string
      title: SessionStatus
      enum:
        - SESSION_STATUS_UNSPECIFIED
        - SESSION_STATUS_ACTIVE
        - SESSION_STATUS_CLOSED
      description: SessionStatus is the lifecycle state of a session.
    livekit.publicapi.analytics.v1.Sessions.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.Sessions.Get.Response:
      type: object
      properties:
        session:
          title: session
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.Session'
        detail:
          oneOf:
            - $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionDetail'
            - type: "null"
          title: detail
          description: |-
            Absent while the session's detail is still being finalized (see
             Session.has_detail_data on the list row).
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.Sessions.List.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        page:
          title: page
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
        filter:
          title: filter
          $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionFilter'
        sortOrder:
          title: sort_order
          description: |-
            Direction of the started_at ordering, the only column sessions sort on.
             Defaults to descending (newest first) when unset.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.SortOrder'
      title: Request
      additionalProperties: false
    livekit.publicapi.analytics.v1.Sessions.List.Response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.analytics.v1.Session'
          title: items
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.analytics.v1.TimeRange:
      type: object
      properties:
        startTime:
          title: start_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endTime:
          title: end_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: TimeRange
      additionalProperties: false
      description: |-
        TimeRange is a half-open window [start_time, end_time). An unset end means
         "now"; an unset start means "end minus a service default" (24h for session
         lists, 7d for stats). Windows are bounded server-side (stats: 62 days).
    livekit.publicapi.common.v1.PageInfo:
      type: object
      properties:
        nextCursor:
          type: string
          title: next_cursor
          description: |-
            Pass as `cursor` on the next request to fetch the following page. Empty on
             the last page.
        hasMore:
          type: boolean
          title: has_more
      title: PageInfo
      additionalProperties: false
      description: PageInfo is the cursor-pagination metadata shared by every list response.
    livekit.publicapi.common.v1.PageRequest:
      type: object
      properties:
        cursor:
          type: string
          title: cursor
          description: |-
            Opaque cursor returned by a prior page (PageInfo.next_cursor). Empty starts
             from the beginning.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: Maximum items to return; 0 lets the server pick a default.
      title: PageRequest
      additionalProperties: false
      description: |-
        PageRequest is the shared cursor-pagination request fragment. Embed it in a
         list request.
    livekit.publicapi.common.v1.SortOrder:
      type: string
      title: SortOrder
      enum:
        - SORT_ORDER_UNSPECIFIED
        - SORT_ORDER_ASC
        - SORT_ORDER_DESC
      description: |-
        SortOrder is the direction of a list request's sort. A list that lets the
         caller pick a direction takes it as `sort_order` and documents its default
         column and direction; one that can also sort on more than one column adds
         its own `<X>SortField sort_by`.
    livekit.publicapi.databases.v1.Databases.Create.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        ttl:
          title: ttl
          description: |-
            Unset: never expires. Otherwise clamped to the server cap, and never
             extended.
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Request
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Create.Response:
      type: object
      properties:
        databaseId:
          type: string
          title: database_id
        expiresAt:
          title: expires_at
          description: Unset when the database never expires.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Response
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Delete.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        databaseId:
          type: string
          title: database_id
      title: Request
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Delete.Response:
      type: object
      title: Response
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Export.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        databaseId:
          type: string
          title: database_id
      title: Request
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Export.Response:
      type: object
      properties:
        downloadUrl:
          type: string
          title: download_url
          description: Pre-authenticated object-storage URL.
        expiresAt:
          title: expires_at
          description: Of the URL, not the database.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        tip:
          type:
            - integer
            - string
          title: tip
          format: int64
          description: The commit sequence the export is consistent at.
      title: Response
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        databaseId:
          type: string
          title: database_id
      title: Request
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.Get.Response:
      type: object
      properties:
        database:
          title: database
          $ref: '#/components/schemas/livekit.AgentDB.AgentDatabase'
      title: Response
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.List.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        page:
          title: page
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
      title: Request
      additionalProperties: false
    livekit.publicapi.databases.v1.Databases.List.Response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.AgentDB.AgentDatabase'
          title: items
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.observability.v1.LogLevel:
      type: string
      title: LogLevel
      enum:
        - LOG_LEVEL_UNSPECIFIED
        - LOG_LEVEL_TRACE
        - LOG_LEVEL_DEBUG
        - LOG_LEVEL_INFO
        - LOG_LEVEL_WARN
        - LOG_LEVEL_ERROR
        - LOG_LEVEL_FATAL
      description: |-
        LogLevel is a log record's level, as the dashboard's logs panel shows and
         filters it. Agents name levels differently by runtime, such as Python's
         CRITICAL and Node's FATAL, so a record's level comes from its OpenTelemetry
         severity number, or from its level name when it has none; a level means the
         same for Python and Node agents.
    livekit.publicapi.observability.v1.LogRecord:
      type: object
      properties:
        id:
          type: string
          title: id
          description: The record's id, the same on every read.
        timestamp:
          title: timestamp
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        level:
          title: level
          $ref: '#/components/schemas/livekit.publicapi.observability.v1.LogLevel'
        severityText:
          type: string
          title: severity_text
          description: The level's name as the agent logged it, such as "WARN" or "CRITICAL".
        logger:
          type: string
          title: logger
          description: The logger that wrote the record (its logger.name attribute).
        message:
          type: string
          title: message
          description: |-
            The record's text. A structured logger's body keeps it under its event,
             message or msg field; a structured body with none of them is written
             here whole, as JSON.
        bodyFields:
          type: object
          title: body_fields
          additionalProperties:
            title: value
            $ref: '#/components/schemas/google.protobuf.Value'
          description: |-
            A structured logger's body fields other than its message; empty for a
             plain text body.
        attributes:
          type: object
          title: attributes
          additionalProperties:
            title: value
            $ref: '#/components/schemas/google.protobuf.Value'
          description: |-
            The record's attributes, typed and nested as the agent recorded them,
             with its resource's and scope's attributes merged in; the record's own
             value wins. An integer beyond ±2^53 is its decimal string, and bytes are
             base64.
        traceId:
          type: string
          title: trace_id
          description: |-
            The trace and span the record was logged in, as lowercase hex; empty when
             it was logged outside one. They link the record to its span in
             GetSessionTraces.
        spanId:
          type: string
          title: span_id
      title: LogRecord
      additionalProperties: false
      description: LogRecord is one log record a session's agent exported.
    livekit.publicapi.observability.v1.LogRecord.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: AttributesEntry
      additionalProperties: false
    livekit.publicapi.observability.v1.LogRecord.BodyFieldsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: BodyFieldsEntry
      additionalProperties: false
    livekit.publicapi.observability.v1.Logs.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
          description: The session's RM_ id.
        page:
          title: page
          description: |-
            page_size counts records, 50 by default and at most 100. A cursor
             pages only a request with the same log_levels and sort_order.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
        logLevels:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.observability.v1.LogLevel'
          title: log_levels
          description: |-
            Only records at these levels, as the dashboard's logs filter selects
             them, for example only TRACE and FATAL. Empty returns every record,
             including those with no level, such as a passed evaluation.
             LOG_LEVEL_UNSPECIFIED is InvalidArgument.
        sortOrder:
          title: sort_order
          description: |-
            Direction of the timestamp ordering. Defaults to ascending (oldest
             first) when unset.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.SortOrder'
      title: Request
      additionalProperties: false
    livekit.publicapi.observability.v1.Logs.Get.Response:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.observability.v1.LogRecord'
          title: records
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.observability.v1.MetricHistogram:
      type: object
      properties:
        count:
          type:
            - integer
            - string
          title: count
          format: int64
          description: How many values were recorded.
        sum:
          type:
            - number
            - "null"
          title: sum
          format: double
          description: Their sum, minimum and maximum; unset when the agent didn't record them.
        min:
          type:
            - number
            - "null"
          title: min
          format: double
        max:
          type:
            - number
            - "null"
          title: max
          format: double
        bucketBounds:
          type: array
          items:
            type: number
            format: double
          title: bucket_bounds
          description: |-
            A histogram's buckets, with one more count than bounds: bucket_counts[0]
             counts the values up to bucket_bounds[0], bucket_counts[i] those in
             (bucket_bounds[i-1], bucket_bounds[i]], and the last count those above
             the last bound. Both are empty for an exponential histogram.
        bucketCounts:
          type: array
          items:
            type:
              - integer
              - string
            format: int64
          title: bucket_counts
      title: MetricHistogram
      additionalProperties: false
      description: MetricHistogram summarizes the values a histogram point recorded.
    livekit.publicapi.observability.v1.MetricKind:
      type: string
      title: MetricKind
      enum:
        - METRIC_KIND_UNSPECIFIED
        - METRIC_KIND_GAUGE
        - METRIC_KIND_SUM
        - METRIC_KIND_HISTOGRAM
        - METRIC_KIND_EXPONENTIAL_HISTOGRAM
      description: MetricKind is the OpenTelemetry data type a metric point was exported as.
    livekit.publicapi.observability.v1.MetricPoint:
      type: object
      allOf:
        - properties:
            name:
              type: string
              title: name
              description: |-
                The metric's name, such as lk.agents.turn.e2e_latency or
                 gen_ai.client.token.usage. The upstream aggregator can file several
                 metrics that share their attributes under one name (GetSessionMetrics).
            unit:
              type: string
              title: unit
              description: |-
                The metric's unit as the agent declared it, such as "s" or "{token}";
                 empty when it declared none.
            kind:
              title: kind
              $ref: '#/components/schemas/livekit.publicapi.observability.v1.MetricKind'
            startTime:
              title: start_time
              description: |-
                The interval the point covers. An agent exports every 30 seconds, so a
                 sum or histogram covers the time since its previous export; a gauge has
                 no start_time.
              $ref: '#/components/schemas/google.protobuf.Timestamp'
            endTime:
              title: end_time
              $ref: '#/components/schemas/google.protobuf.Timestamp'
            attributes:
              type: object
              title: attributes
              additionalProperties:
                title: value
                $ref: '#/components/schemas/google.protobuf.Value'
              description: |-
                The point's attributes, typed and nested as the agent recorded them, with
                 its resource's and scope's attributes merged in, such as room_id, job_id,
                 lk.agent_name and the model's model_name; the point's own value wins. With
                 two agents in one session, the resource's can be the other agent's. An
                 integer beyond ±2^53 is its decimal string, and bytes are base64.
        - oneOf:
            - type: object
              properties:
                histogram:
                  title: histogram
                  description: A histogram's or exponential histogram's summary.
                  $ref: '#/components/schemas/livekit.publicapi.observability.v1.MetricHistogram'
              title: histogram
              required:
                - histogram
            - type: object
              properties:
                value:
                  type: number
                  title: value
                  format: double
                  description: A gauge's or sum's value.
              title: value
              required:
                - value
            - not:
                anyOf:
                  - required:
                      - histogram
                  - required:
                      - value
      unevaluatedProperties: false
      title: MetricPoint
      description: |-
        MetricPoint is one OpenTelemetry metric data point a session's agent
         exported. It is the raw metric the agent emits, so it won't exactly match
         the dashboard's metrics panel, which derives its numbers from the transcript
         and traces. Only agents that export OpenTelemetry metrics to LiveKit Cloud
         produce points; an agent whose code installs its own MeterProvider exports
         none to LiveKit Cloud.
    livekit.publicapi.observability.v1.MetricPoint.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: AttributesEntry
      additionalProperties: false
    livekit.publicapi.observability.v1.Metrics.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
          description: The session's RM_ id.
        page:
          title: page
          description: |-
            page_size counts points, 50 by default and at most 100. A cursor pages
             only a request with the same names.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
        names:
          type: array
          items:
            type: string
          title: names
          description: |-
            Only the points of these metrics, matched exactly, such as
             lk.agents.turn.e2e_latency. Empty returns every metric. At most 50
             names, each 1 to 256 characters.
      title: Request
      additionalProperties: false
    livekit.publicapi.observability.v1.Metrics.Get.Response:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.observability.v1.MetricPoint'
          title: points
          description: |-
            By end time, oldest first; points that end together are ordered by
             start time, a point with none first, then by kind and a hash of what
             they recorded, not by name. A page continues
             after the previous page's last point, so on an ACTIVE session a point
             exported mid-read with a later time comes on a later page, and one
             with an earlier time is missed until a new read.
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.observability.v1.Recording.GetURL.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
        fileType:
          title: file_type
          description: Which recording to sign a URL for. UNSPECIFIED is InvalidArgument.
          $ref: '#/components/schemas/livekit.publicapi.observability.v1.RecordingFileType'
        expirySeconds:
          type: integer
          title: expiry_seconds
          description: |-
            How long the URL stays valid, in seconds. Unset or 0 is 900 (15
             minutes), and anything longer is clamped to 900 without an error;
             expires_at says what was granted.
      title: Request
      additionalProperties: false
    livekit.publicapi.observability.v1.Recording.GetURL.Response:
      type: object
      properties:
        url:
          type: string
          title: url
          description: |-
            A signed URL that downloads the recording straight from the object
             store in the project's data region, without credentials, until
             expires_at. Audio is Ogg; chat history is JSON served with
             Content-Encoding: gzip.
        recordingStartedAt:
          title: recording_started_at
          description: |-
            When the recording started, as the agent reported it on upload. Line
             the audio up with the transcript by it.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        expiresAt:
          title: expires_at
          description: |-
            When the URL stops working: the request's time plus the granted
             expiry, after the 15-minute clamp.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Response
      additionalProperties: false
    livekit.publicapi.observability.v1.RecordingFileType:
      type: string
      title: RecordingFileType
      enum:
        - RECORDING_FILE_TYPE_UNSPECIFIED
        - RECORDING_FILE_TYPE_AUDIO
        - RECORDING_FILE_TYPE_CHAT_HISTORY
      description: |-
        RecordingFileType is the recording requested from GetSessionRecordingURL.
         The session's conversation as typed items comes from GetSessionTranscript,
         not from a recording.
    livekit.publicapi.observability.v1.Role:
      type: string
      title: Role
      enum:
        - ROLE_UNSPECIFIED
        - ROLE_USER
        - ROLE_AGENT
        - ROLE_SYSTEM
        - ROLE_DEVELOPER
      description: Role is who a transcript message is from.
    livekit.publicapi.observability.v1.Span:
      type: object
      properties:
        spanId:
          type: string
          title: span_id
          description: The span's ids, as lowercase hex.
        traceId:
          type: string
          title: trace_id
        parentSpanId:
          type: string
          title: parent_span_id
          description: |-
            Empty for a root span. A span whose parent isn't among the session's
             spans is a root too, as the dashboard shows it.
        name:
          type: string
          title: name
        startTime:
          title: start_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endTime:
          title: end_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        kind:
          title: kind
          $ref: '#/components/schemas/livekit.publicapi.observability.v1.SpanKind'
        status:
          title: status
          $ref: '#/components/schemas/livekit.publicapi.observability.v1.SpanStatus'
        statusMessage:
          type: string
          title: status_message
        attributes:
          type: object
          title: attributes
          additionalProperties:
            title: value
            $ref: '#/components/schemas/google.protobuf.Value'
          description: |-
            The span's attributes, typed and nested as the agent recorded them, with
             its resource's and scope's attributes merged in, such as lk.agent_name;
             the span's own value wins. An integer beyond ±2^53 is its decimal string,
             and bytes are base64.
        events:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.observability.v1.SpanEvent'
          title: events
      title: Span
      additionalProperties: false
      description: |-
        Span is one unit of work in the session's trace, such as an agent turn or
         an LLM request.
    livekit.publicapi.observability.v1.Span.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: AttributesEntry
      additionalProperties: false
    livekit.publicapi.observability.v1.SpanEvent:
      type: object
      properties:
        timestamp:
          title: timestamp
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        name:
          type: string
          title: name
        attributes:
          type: object
          title: attributes
          additionalProperties:
            title: value
            $ref: '#/components/schemas/google.protobuf.Value'
          description: The event's own attributes, typed and nested as the agent recorded them.
      title: SpanEvent
      additionalProperties: false
      description: |-
        SpanEvent is a timestamped event recorded within a Span, such as an
         exception.
    livekit.publicapi.observability.v1.SpanEvent.AttributesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: AttributesEntry
      additionalProperties: false
    livekit.publicapi.observability.v1.SpanKind:
      type: string
      title: SpanKind
      enum:
        - SPAN_KIND_UNSPECIFIED
        - SPAN_KIND_INTERNAL
        - SPAN_KIND_SERVER
        - SPAN_KIND_CLIENT
        - SPAN_KIND_PRODUCER
        - SPAN_KIND_CONSUMER
      description: SpanKind is a span's OpenTelemetry kind.
    livekit.publicapi.observability.v1.SpanStatus:
      type: string
      title: SpanStatus
      enum:
        - SPAN_STATUS_UNSPECIFIED
        - SPAN_STATUS_OK
        - SPAN_STATUS_ERROR
      description: SpanStatus is a span's OpenTelemetry status code.
    livekit.publicapi.observability.v1.Traces.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
          description: The session's RM_ id.
        page:
          title: page
          description: |-
            page_size counts spans, 50 by default and at most 100, so a page can
             hold fewer spans than its size. A span can be large, since an LLM
             span carries the whole chat context so far.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
      title: Request
      additionalProperties: false
    livekit.publicapi.observability.v1.Traces.Get.Response:
      type: object
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.observability.v1.Span'
          title: spans
          description: |-
            By start time, oldest first. Spans that start together are ordered by
             span id as the aggregator stores it: the id's 8 bytes read as a
             little-endian unsigned integer, which isn't the order of its hex
             string. The pages read the spans the first page found, so a span
             exported later waits for a new read. On an ACTIVE session, a span
             exported mid-read can still shift the later pages, which are read by
             offset, so a span can repeat or be skipped: dedupe by span_id, and
             read again from the first page to pick up a skipped span.
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
      title: Response
      additionalProperties: false
    livekit.publicapi.observability.v1.Transcript.Get.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        sessionId:
          type: string
          title: session_id
          description: The session's RM_ id.
        page:
          title: page
          description: |-
            page_size counts the agent's transcript records read, 50 by default
             and at most 100, so a page can hold fewer items than its size.
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
      title: Request
      additionalProperties: false
    livekit.publicapi.observability.v1.Transcript.Get.Response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.observability.v1.TranscriptItem'
          title: items
          description: Oldest first, in the order the agent recorded them.
        pageInfo:
          title: page_info
          $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
        skippedRecords:
          type: integer
          title: skipped_records
          description: |-
            How many of this page's records couldn't be read as transcript items
             and were left out, such as an item kind newer than this server. Zero
             when the page is complete.
      title: Response
      additionalProperties: false
    livekit.publicapi.observability.v1.TranscriptItem:
      type: object
      allOf:
        - properties:
            id:
              type: string
              title: id
              description: The item's id, as the agent assigned it (item_...).
            timestamp:
              title: timestamp
              description: |-
                When the item happened. For a message, when its speaker started speaking,
                 else when the agent created it; for any other item, when the agent
                 recorded it. Items are ordered by when the agent recorded them, so a
                 message's timestamp can be earlier than the item before it.
              $ref: '#/components/schemas/google.protobuf.Timestamp'
        - oneOf:
            - type: object
              properties:
                agentHandoff:
                  title: agent_handoff
                  $ref: '#/components/schemas/livekit.publicapi.observability.v1.TranscriptItem.AgentHandoff'
              title: agent_handoff
              required:
                - agentHandoff
            - type: object
              properties:
                configUpdate:
                  title: config_update
                  $ref: '#/components/schemas/livekit.publicapi.observability.v1.TranscriptItem.ConfigUpdate'
              title: config_update
              required:
                - configUpdate
            - type: object
              properties:
                message:
                  title: message
                  $ref: '#/components/schemas/livekit.publicapi.observability.v1.TranscriptItem.Message'
              title: message
              required:
                - message
            - type: object
              properties:
                toolCall:
                  title: tool_call
                  $ref: '#/components/schemas/livekit.publicapi.observability.v1.TranscriptItem.ToolCall'
              title: tool_call
              required:
                - toolCall
            - type: object
              properties:
                toolResult:
                  title: tool_result
                  $ref: '#/components/schemas/livekit.publicapi.observability.v1.TranscriptItem.ToolResult'
              title: tool_result
              required:
                - toolResult
            - not:
                anyOf:
                  - required:
                      - agentHandoff
                  - required:
                      - configUpdate
                  - required:
                      - message
                  - required:
                      - toolCall
                  - required:
                      - toolResult
      unevaluatedProperties: false
      title: TranscriptItem
      description: |-
        TranscriptItem is one ordered entry in a session's conversation. Exactly one
         of the `item` variants is set.
    livekit.publicapi.observability.v1.TranscriptItem.AgentHandoff:
      type: object
      properties:
        fromAgentId:
          type: string
          title: from_agent_id
          description: Unset for the session's first agent.
        toAgentId:
          type: string
          title: to_agent_id
      title: AgentHandoff
      additionalProperties: false
      description: AgentHandoff is the session passing from one agent to another.
    livekit.publicapi.observability.v1.TranscriptItem.ConfigUpdate:
      type: object
      properties:
        instructions:
          type: string
          title: instructions
          description: The agent's new instructions; empty when they didn't change.
        toolsAdded:
          type: array
          items:
            type: string
          title: tools_added
        toolsRemoved:
          type: array
          items:
            type: string
          title: tools_removed
      title: ConfigUpdate
      additionalProperties: false
      description: |-
        ConfigUpdate is a change to the agent's instructions or tools during the
         session.
    livekit.publicapi.observability.v1.TranscriptItem.Message:
      type: object
      properties:
        role:
          title: role
          $ref: '#/components/schemas/livekit.publicapi.observability.v1.Role'
        text:
          type: string
          title: text
          description: |-
            The message's text. Text the agent recorded in several parts is joined
             with newlines. When redacted is set, PII in it is replaced with
             <redaction type="..."/> markers.
        interrupted:
          type: boolean
          title: interrupted
          description: Set on an agent message the user talked over before it finished.
        redacted:
          type: boolean
          title: redacted
          description: Set when the project's PII redaction rewrote the text.
        transcriptConfidence:
          type:
            - number
            - "null"
          title: transcript_confidence
          format: double
          description: The speech-to-text confidence of a spoken user message, from 0 to 1.
        startedSpeakingAt:
          title: started_speaking_at
          description: |-
            When the speaker started and stopped speaking; unset for a message
             that wasn't spoken.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        stoppedSpeakingAt:
          title: stopped_speaking_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        e2eLatencyMs:
          type:
            - number
            - "null"
          title: e2e_latency_ms
          format: double
          description: |-
            The turn's latencies in milliseconds, converted from the seconds the
             agent recorded; unset when the agent didn't record one. An agent message
             carries the first three, a user message the last three.

             End-to-end latency: from when the user finished speaking to when the
             agent began responding (the agent's e2e_latency).
        llmTtftMs:
          type:
            - number
            - "null"
          title: llm_ttft_ms
          format: double
          description: LLM time to first token (llm_node_ttft).
        ttsTtfbMs:
          type:
            - number
            - "null"
          title: tts_ttfb_ms
          format: double
          description: TTS time to first byte of audio (tts_node_ttfb).
        transcriptionDelayMs:
          type:
            - number
            - "null"
          title: transcription_delay_ms
          format: double
          description: |-
            From the end of the user's speech to its final transcript
             (transcription_delay).
        endOfTurnDelayMs:
          type:
            - number
            - "null"
          title: end_of_turn_delay_ms
          format: double
          description: |-
            From the end of the user's speech to the agent deciding the turn ended
             (end_of_turn_delay).
        onUserTurnCompletedDelayMs:
          type:
            - number
            - "null"
          title: on_user_turn_completed_delay_ms
          format: double
          description: |-
            Time spent in the agent's on_user_turn_completed callback
             (on_user_turn_completed_delay).
      title: Message
      additionalProperties: false
      description: Message is something said, or added to the conversation as text.
    livekit.publicapi.observability.v1.TranscriptItem.ToolCall:
      type: object
      properties:
        name:
          type: string
          title: name
        callId:
          type: string
          title: call_id
          description: Pairs the call with its ToolResult.
        arguments:
          type: string
          title: arguments
          description: The call's arguments as a JSON string.
      title: ToolCall
      additionalProperties: false
      description: ToolCall is the agent calling a tool.
    livekit.publicapi.observability.v1.TranscriptItem.ToolResult:
      type: object

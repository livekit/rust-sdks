[package]
name = "livekit-public-api-generate"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: run by ../generate.sh, not part of the SDK workspace.
[workspace]

[dependencies]
openapiv3 = "2.2"
progenitor = { version = "0.15.1", default-features = false }
prettyplease = "0.2"
quote = "1"
serde_json = "1"
serde_yaml = "0.9"
syn = "2"

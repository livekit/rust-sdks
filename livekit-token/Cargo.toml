[package]
name = "livekit-token"
version = "0.1.1"
license.workspace = true
description = "Core logic for generating LiveKit tokens"
edition.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
livekit-protocol = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"

# access_token: HS256 only, via the in-crate HMAC CryptoProvider (jwt_provider.rs).
# Dropping jsonwebtoken's rust_crypto bundle avoids linking RSA/EC/EdDSA.
jsonwebtoken = { version = "10", default-features = false }
hmac = "0.12"
signature = "2"

[dev-dependencies]
# The tests assert that `kind` and `inference` are *absent* from the payload when unset, which
# needs to look at the serialized claims. A dev-dependency does not propagate, so this does not
# widen what a consumer of this crate builds.
serde_json = { workspace = true }

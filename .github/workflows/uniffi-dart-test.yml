name: UniFFI Dart tests

# Builds the Dart package (dev mode: host cdylib + generated bindings) and runs
# its test suite, exercising the FFI boundary end-to-end. Scoped to changes that
# can affect the livekit-uniffi Dart bindings.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "livekit-uniffi/**"
      - "livekit-api/**"
      - "livekit-protocol/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".cargo/**"
      - ".github/workflows/uniffi-dart-test.yml"

permissions:
  contents: read

jobs:
  dart-test:
    # TODO: Fix tests then re-enable.
    if: false
    name: Dart package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Install Common Deps for UniFFI Tasks
        uses: ./.github/actions/uniffi-deps

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-dart-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-dart-

      - name: Build Dart package
        working-directory: livekit-uniffi
        run: cargo make dart-package

      - name: Run Dart tests
        working-directory: livekit-uniffi/packages/dart
        run: |
          dart pub get
          dart test

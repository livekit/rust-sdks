name: Builds

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".changeset/**"
      - "LICENSE"
      - "NOTICE"
      - "renovate.json"
      - ".vscode/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # sccache caches rustc invocations across runs (key: source hash + flags).
  # RUSTC_WRAPPER is intentionally NOT set at workflow scope — see the probe
  # step below for why (transient GHA cache backend errors should not fail
  # the whole build). We do NOT wrap CC/CXX in this workflow because the
  # matrix includes cross-compile targets (iOS, Android, Windows-arm64)
  # where wrapping is fragile.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ffi_platform: ffi-desktop
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ffi_platform: ffi-windows-arm64
            #extraargs: --exclude livekit-api --exclude livekit-ffi # waiting for v0.17 of ring
          - os: macos-latest
            target: x86_64-apple-darwin
            ffi_platform: ffi-desktop
          - os: macos-latest
            target: aarch64-apple-darwin
            ffi_platform: ffi-desktop
          - os: macos-latest
            target: aarch64-apple-ios
            ffi_platform: ffi-ios
            # Measured: the swift row has no crate-type (cargo-swift picks it), so
            # the static archive is measured as the proxy for the framework.
            core_platform: swift
            core_crate_type: staticlib
          - os: macos-latest
            target: aarch64-apple-ios-sim
            ffi_platform: ffi-ios
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ffi_platform: ffi-desktop
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ffi_platform: ffi-desktop
          - os: ubuntu-latest
            target: aarch64-linux-android
            ffi_platform: ffi-android
            core_platform: android
            ndk_arch: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            ffi_platform: ffi-android
            ndk_arch: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: x86_64-linux-android
            ffi_platform: ffi-android
            ndk_arch: x86_64-unknown-linux-musl

    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Install Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'}}
        run: |
          sudo apt update -y
          # libasound2-dev is needed for local_audio example
          # libdrm, libgbm, libxfixes, libxdamage, libxrandr, libxcomposite and libglib are needed for DesktopCapturer
          # lld is needed on aarch64 because GNU ld cannot link libwebrtc.a for some reason
          sudo apt install -y \
            lld \
            libasound2-dev \
            libssl-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxext-dev \
            libdrm-dev \
            libgbm-dev \
            libxfixes-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libglib2.0-dev

      - name: Install VA-API/NVIDIA drivers for linux x64 build
        if: ${{ matrix.os == 'ubuntu-latest'}}
        run: |
          sudo apt install -y libva-dev libdrm-dev libnvidia-compute-570 libnvidia-decode-570 nvidia-cuda-dev -y

      # Ubuntu 24 ships clang 18; webrtc-sys needs 21+ for libwebrtc's hermetic
      # libc++. Sets CC/CXX for the steps below. Android targets are excluded:
      # cargo-ndk supplies its own NDK clang.
      - name: Install clang for webrtc-sys
        if: ${{ contains(matrix.target, 'unknown-linux-gnu') }}
        run: .github/scripts/install-clang.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Enable sccache wrapping (probe first)
        shell: bash
        run: |
          # Probe the GHA cache backend by starting the sccache server. If it
          # fails (transient HTTP 400 from actions.githubusercontent.com has
          # been seen in practice), skip exporting RUSTC_WRAPPER so the build
          # falls back to vanilla rustc instead of erroring out.
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "::notice::sccache enabled (RUSTC_WRAPPER=sccache)"
          else
            echo "::warning::sccache backend unreachable; building without compile cache this run"
          fi

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.target }}-

      - name: Build (Cargo)
        if: ${{ !contains(matrix.target, 'android') }}
        run: |
          cargo build --release --workspace -p livekit --target ${{ matrix.target }}

      - name: Build (Android)
        if: ${{ contains(matrix.target, 'android') }}
        run: |
          cargo install cargo-ndk
          # FIXME: wgpu_room does not link on aarch64
          cargo ndk --target ${{ matrix.target }} build --release -p livekit --workspace -vv

      # The workspace build above compiles livekit-ffi, but not as anything
      # ships it: it uses the default features, and emits every crate type in
      # livekit-ffi's [lib], whose rlib makes cargo drop LTO. Build it again
      # the way this target's release build does, from the same
      # [package.metadata.platform-features] row ffi-builds.yml uses. That
      # checks the shipped configuration on every commit, and gives a size
      # worth recording.
      - name: Resolve livekit-ffi platform flags
        shell: bash
        run: |
          set -euo pipefail
          # Windows runners may have only `python`, and `python3` there can be
          # the Microsoft Store stub, so probe by running it.
          for py in python3 python; do
            if "$py" --version >/dev/null 2>&1; then break; fi
          done
          echo "PYTHON=$py" >> "$GITHUB_ENV"

          echo "FFI_FLAGS=$("$py" .github/scripts/ffi_features.py ${{ matrix.ffi_platform }})" >> "$GITHUB_ENV"

          if [ -n "${{ matrix.core_platform }}" ]; then
            core=$("$py" .github/scripts/ffi_features.py ${{ matrix.core_platform }})
            if [ -n "${{ matrix.core_crate_type }}" ]; then
              core="--lib --crate-type ${{ matrix.core_crate_type }} $core"
            fi
            echo "CORE_FLAGS=$core" >> "$GITHUB_ENV"
          fi

      - name: Build livekit-ffi (room-apis, as shipped)
        if: ${{ !contains(matrix.target, 'android') }}
        shell: bash
        run: cargo rustc -p livekit-ffi $FFI_FLAGS --release --target ${{ matrix.target }}

      - name: Build livekit-ffi (room-apis, as shipped, Android)
        if: ${{ contains(matrix.target, 'android') }}
        shell: bash
        run: cargo ndk --target ${{ matrix.target }} rustc -p livekit-ffi $FFI_FLAGS --release

      # As ffi-builds.yml does before packaging the archive.
      - name: Strip livekit-ffi static archive (room-apis, iOS)
        if: ${{ contains(matrix.target, 'apple-ios') }}
        run: |
          xcrun strip -S target/${{ matrix.target }}/release/liblivekit_ffi.a
          xcrun ranlib target/${{ matrix.target }}/release/liblivekit_ffi.a

      - name: Measure livekit-ffi (room-apis)
        shell: bash
        run: |
          "$PYTHON" .github/scripts/ffi_size.py measure --row room-apis \
            --target ${{ matrix.target }} --flags "$FFI_FLAGS" \
            --out sizes/room-apis-${{ matrix.target }}.json

      # core-modules is mutually exclusive with room-apis, so it needs its own
      # build or nothing would compile it per-commit across this matrix. Most
      # targets only check that it compiles; the targets with a
      # `core_platform` build and measure what the Swift and Android packages
      # ship, which is what the size budgets in livekit-ffi/Makefile.toml gate.
      - name: Build (Cargo, livekit-ffi core-modules)
        if: ${{ !contains(matrix.target, 'android') && !matrix.core_platform }}
        shell: bash
        run: |
          cargo build --release -p livekit-ffi --target ${{ matrix.target }} \
            --no-default-features --features core-modules

      - name: Build (Android, livekit-ffi core-modules)
        if: ${{ contains(matrix.target, 'android') && !matrix.core_platform }}
        shell: bash
        run: |
          cargo ndk --target ${{ matrix.target }} build --release -p livekit-ffi \
            --no-default-features --features core-modules

      # Overwrites the room-apis archive measured above.
      - name: Build livekit-ffi (core-modules, as shipped, iOS)
        if: ${{ contains(matrix.target, 'apple-ios') && matrix.core_platform }}
        shell: bash
        run: |
          cargo rustc -p livekit-ffi $CORE_FLAGS --release --target ${{ matrix.target }}
          xcrun strip -S target/${{ matrix.target }}/release/liblivekit_ffi.a
          xcrun ranlib target/${{ matrix.target }}/release/liblivekit_ffi.a

      # The Android package build sets these RUSTFLAGS (livekit-ffi/Makefile.toml).
      # Changing RUSTFLAGS invalidates every crate, so build in a target dir of
      # its own rather than evicting the workspace build's artifacts.
      - name: Build livekit-ffi (core-modules, as shipped, Android)
        if: ${{ contains(matrix.target, 'android') && matrix.core_platform }}
        shell: bash
        env:
          RUSTFLAGS: -C force-unwind-tables=no
          CARGO_TARGET_DIR: target/core-modules
        run: cargo ndk --target ${{ matrix.target }} rustc -p livekit-ffi $CORE_FLAGS --release

      - name: Measure livekit-ffi (core-modules)
        if: ${{ matrix.core_platform }}
        shell: bash
        run: |
          target_dir=target
          if [[ "${{ matrix.target }}" == *android* ]]; then target_dir=target/core-modules; fi
          "$PYTHON" .github/scripts/ffi_size.py measure --row core-modules \
            --target ${{ matrix.target }} --flags "$CORE_FLAGS" --target-dir "$target_dir" \
            --out sizes/core-modules-${{ matrix.target }}.json

      - name: Upload livekit-ffi sizes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffi-size-${{ matrix.target }}
          path: sizes/
          if-no-files-found: ignore

  # Merges the per-target sizes into one table on the run summary, and keeps
  # them as the `ffi-size-summary` artifact so later runs can compare against
  # the build on main.
  ffi-size:
    name: livekit-ffi sizes
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download sizes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ffi-size-*
          merge-multiple: true
          path: sizes

      # On a pull request, checkout builds GitHub's merge of the head into
      # the base, and that merge commit is github.sha. Record it as what was
      # measured, and the head separately, since that is the commit people
      # will recognize.
      - name: Summarize
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p sizes
          python3 .github/scripts/ffi_size.py summary sizes \
            --sha "$GITHUB_SHA" --pr-head-sha "$PR_HEAD_SHA" \
            --json size-summary.json --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffi-size-summary
          path: size-summary.json
          retention-days: 90

name: UniFFI Dart package

# Publishes the generated livekit_uniffi Dart package to pub.dev on a
# livekit-ffi release, together with the native libraries it loads.
#
# This is a separate workflow from uniffi-packages.yml because pub.dev's
# automated publishing accepts a run only when its OIDC token says the ref is
# a *tag* matching the pattern configured on the package
# (livekit-ffi/v{{version}}); a release-event-triggered workflow is rejected.
#
# livekit-ffi uses knope's draft-release flow, and the tag ffi-builds.yml
# creates with GITHUB_TOKEN emits no push event (#1256). So the normal trigger
# is ffi-builds.yml dispatching this workflow with `--ref <tag>` once the
# release is published: workflow_dispatch is exempt from GitHub's recursion
# guard, and dispatching at the tag still gives the run refType "tag". The
# push trigger below stays for a tag pushed by hand.
#
# The package's hook/build.dart downloads build-<triple>.zip assets from the
# GitHub release at consumer build time, so a pub.dev version whose assets are
# missing would be broken on arrival, and pub.dev versions cannot be
# unpublished. The cdylib job below builds and attaches those assets in this
# same run, and the publish job depends on it, so the package can only be
# published once every asset is on the release.
#
# Publishing is enabled. The run publishes to pub.dev through OIDC
# (dart-lang/setup-dart exchanges the job token), and pub.dev accepts that
# token only if all of the following hold on the package's automated-publishing
# settings. Every one of them has to be set up before the first release:
#
#   - the package `livekit_ffi` exists. pub.dev only automates packages that
#     already exist, so it needs one manual publish first -- this is a new
#     package, not a rename of `livekit_uniffi`, whose settings do not carry
#     over
#   - repository `livekit/rust-sdks`, tag pattern `livekit-ffi/v{{version}}`
#   - "Enable publishing from `workflow_dispatch` events" is checked, since
#     that is how ffi-builds.yml starts this run
#   - "Require GitHub Actions environment" is checked, with `pub.dev` as the
#     name, matching the `environment:` on the publish job below
#
# The environment is the real guard: give it a deployment-tag rule for
# `livekit-ffi/v*` in the repository settings, and GitHub refuses to mint a
# token carrying that environment for a run on any other ref. That is enforced
# server-side, so editing this file cannot get around it.
#
# Recovery: if a run fails, fix the cause and re-run the failed jobs, or
# dispatch this workflow with the tag. A dispatch rebuilds and re-attaches the
# assets (with --clobber), re-validates, and publishes -- so set dry_run when
# only exercising the workflow.

on:
  push:
    tags: ["livekit-ffi/v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build everything but skip the release asset upload."
        type: boolean
        default: false

env:
  # Set to "false" to pause publishing while keeping asset uploads and
  # validation. This is a convenience switch only -- what actually constrains
  # publishing is the pub.dev configuration and the `pub.dev` environment
  # described above, both of which GitHub and pub.dev enforce server-side.
  PUBLISH_ENABLED: "true"

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        # Bound through env, never template-expanded into the script: tag names
        # and dispatch inputs may contain shell metacharacters (Actions script
        # injection), and the outputs feed jobs that write release assets and
        # can mint the pub.dev publish token.
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$PUSHED_TAG}"
          case "$TAG" in
            livekit-ffi/v*) ;;
            *) echo "Unexpected tag: $TAG"; exit 1 ;;
          esac
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#livekit-ffi/v}" >> "$GITHUB_OUTPUT"

      # Fast fail on a mis-pointed tag before spending runner time on the
      # cdylib matrix: the tag version must match the crate version the tag
      # carries (it is also what the pubspec, and pub.dev's tag-pattern check,
      # will see). Only the manifest is needed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tag.outputs.tag_name }}
          sparse-checkout: livekit-ffi/Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Check tag matches crate version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          crate_version=$(grep -m1 '^version = ' livekit-ffi/Cargo.toml | cut -d'"' -f2)
          if [ "$crate_version" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match livekit-ffi crate version $crate_version." >&2
            exit 1
          fi

  # Builds build-<triple>.zip (+ .sha256) for every target and attaches them to
  # the release. Runs here rather than in uniffi-packages.yml so the publish
  # job can depend on it directly instead of polling the release for assets.
  cdylib:
    needs: resolve-tag
    permissions:
      # The upload step attaches assets to the release with the workflow token.
      contents: write
    uses: ./.github/workflows/uniffi-cdylib.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}

  build-and-publish:
    name: Build & publish Dart package
    needs: [resolve-tag, cdylib]
    runs-on: ubuntu-latest
    # Names the environment in the OIDC token so pub.dev's "Require GitHub
    # Actions environment" check passes, and subjects the job to the
    # environment's deployment-tag rule. Configure that rule to allow only
    # `livekit-ffi/v*`; see the note at the top of this file.
    environment: pub.dev
    permissions:
      contents: read
      # Exchanged for a temporary pub.dev token by dart-lang/setup-dart.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build the tagged source, not the dispatch ref (which defaults to main).
          ref: ${{ needs.resolve-tag.outputs.tag_name }}
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      # Same keys as uniffi-dart-test.yml, so pushes to main keep them warm.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-dart-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-dart-

      - name: Install Common Deps for UniFFI Tasks
        uses: ./.github/actions/uniffi-deps

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          # Pinned, and kept identical to uniffi-dart-test.yml, so PR CI
          # validates the SDK the publish runs with. A floating channel could
          # introduce a new lint that fails the dry run only on release day.
          # Bump both together.
          sdk: 3.13.1

      - name: Build Dart package (release)
        working-directory: livekit-ffi
        run: cargo make --profile release dart-package

      # pub builds the publish archive from git's file listing, and the
      # generated packages/ tree is gitignored, so publishing from inside the
      # work tree produces an empty archive. Stage a copy outside it.
      #
      # The guard is a backstop for the dart-clean task: a package that ships
      # a local native library would shadow the hook's download mode for every
      # consumer, and pub.dev versions cannot be unpublished.
      - name: Stage package outside the work tree
        run: |
          rm -rf "$RUNNER_TEMP/livekit_uniffi"
          cp -R livekit-ffi/packages/dart "$RUNNER_TEMP/livekit_uniffi"
          if find "$RUNNER_TEMP/livekit_uniffi" \( -name 'liblivekit_ffi.*' -o -name 'livekit_uniffi.dll' \) | grep -q .; then
            echo "Staged package contains a local native library; refusing to publish." >&2
            exit 1
          fi

      - name: Validate package
        working-directory: ${{ runner.temp }}/livekit_uniffi
        run: |
          dart pub get
          dart pub publish --dry-run

      - name: Publish to pub.dev
        if: ${{ env.PUBLISH_ENABLED == 'true' && !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/livekit_uniffi
        run: dart pub publish --force

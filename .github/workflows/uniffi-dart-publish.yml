name: UniFFI Dart package
# release.yml finds a run by this exact name. Only a run named
# "Publish Dart package <tag>" counts as the publish for that tag: a dry run
# uploads and publishes nothing, but ends as a success too.
run-name: ${{ inputs.dry_run && 'Dry run' || 'Publish' }} Dart package ${{ inputs.tag_name }}

# Publishes the generated livekit_ffi Dart package to pub.dev on a
# livekit-ffi release, together with the native libraries it loads.
#
# This is a separate workflow from uniffi-packages.yml because pub.dev's
# automated publishing accepts a run only when its OIDC token says the ref is
# a *tag* matching the pattern configured on the package
# (livekit-ffi/v{{version}}); a release-event-triggered workflow is rejected.
#
# The tag that release.yml creates with GITHUB_TOKEN emits no push event
# (#1256). So the normal trigger is release.yml dispatching this workflow with
# `--ref <tag>` once the release is public: workflow_dispatch is exempt from
# GitHub's recursion guard, and dispatching at the tag still gives the run
# refType "tag". For a run by hand, dispatch this workflow at the tag (select
# the tag as the ref) with `tag_name`.
#
# The package's hook/build.dart downloads build-<triple>.zip assets from the
# GitHub release at consumer build time, so a pub.dev version whose assets are
# missing would be broken on arrival, and pub.dev versions cannot be
# unpublished. release.yml builds those assets before it creates the tag and
# attaches them before the release becomes public. This workflow builds none:
# its first job fails unless the release is public and has every file of
# `release.required_assets` in verwalter.toml.
#
# Publishing is enabled. The run publishes to pub.dev through OIDC
# (dart-lang/setup-dart exchanges the job token), and pub.dev accepts that
# token only if all of the following hold on the package's automated-publishing
# settings. Every one of them has to be set up before the first release:
#
#   - the package `livekit_ffi` exists. pub.dev only automates packages that
#     already exist, so it needs one manual publish first -- this is a new
#     package, not a rename of `livekit_uniffi`, whose settings do not carry
#     over
#   - repository `livekit/rust-sdks`, tag pattern `livekit-ffi/v{{version}}`
#   - "Enable publishing from `workflow_dispatch` events" is checked, since
#     that is how release.yml starts this run
#   - "Require GitHub Actions environment" is checked, with `pub.dev` as the
#     name, matching the `environment:` on the publish job below
#
# The environment is the real guard: give it a deployment-tag rule for
# `livekit-ffi/v*` in the repository settings, and GitHub refuses to mint a
# token carrying that environment for a run on any other ref. That is enforced
# server-side, so editing this file cannot get around it.
#
# Recovery: if a run fails, fix the cause and re-run the failed jobs, or
# dispatch this workflow with the tag. A dispatch checks the release assets,
# re-validates, and publishes -- so set dry_run when only exercising the
# workflow.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build and validate the package but do not publish it."
        type: boolean
        default: false

env:
  # Set to "false" to pause publishing while keeping asset uploads and
  # validation. This is a convenience switch only -- what actually constrains
  # publishing is the pub.dev configuration and the `pub.dev` environment
  # described above, both of which GitHub and pub.dev enforce server-side.
  PUBLISH_ENABLED: "true"

permissions:
  contents: read

# One run for each tag. release.yml waits for this run, and a second run of
# that job must not publish at the same time as the first one.
concurrency:
  group: uniffi-dart-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
      published: ${{ steps.ask.outputs.exists }}
    steps:
      - name: Resolve tag
        id: tag
        # Bound through env, never template-expanded into the script: tag names
        # and dispatch inputs may contain shell metacharacters (Actions script
        # injection), and the outputs feed jobs that write release assets and
        # can mint the pub.dev publish token.
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          case "$TAG" in
            livekit-ffi/v*) ;;
            *) echo "Unexpected tag: $TAG"; exit 1 ;;
          esac
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#livekit-ffi/v}" >> "$GITHUB_OUTPUT"

      # Fast fail on a mis-pointed tag: the tag version must match the crate
      # version the tag carries (it is also what the pubspec, and pub.dev's
      # tag-pattern check, will see). Only the manifest and the asset list are
      # needed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tag.outputs.tag_name }}
          sparse-checkout: |
            livekit-ffi/Cargo.toml
            verwalter.toml
          sparse-checkout-cone-mode: false

      - name: Check tag matches crate version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          crate_version=$(grep -m1 '^version = ' livekit-ffi/Cargo.toml | cut -d'"' -f2)
          if [ "$crate_version" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match livekit-ffi crate version $crate_version." >&2
            exit 1
          fi

      # Safe to run again: pub.dev versions cannot be replaced, so a version
      # that pub.dev has is not built and not published a second time.
      - name: Ask pub.dev for the version
        id: ask
        env:
          URL: https://pub.dev/api/packages/livekit_ffi/versions/${{ steps.tag.outputs.version }}
          WHAT: livekit_ffi ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 "$URL")
          case "$code" in
            200) echo "${WHAT} is there: nothing to publish."; echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "${WHAT} is not there yet."; echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::${URL} answered HTTP ${code}"; exit 1 ;;
          esac

      # pub.dev versions cannot be unpublished, and the package downloads
      # its native libraries from the release. So the release must be public
      # and complete before anything is published. A draft release is not
      # visible to this token and fails here too.
      - name: Check that the release is public and has every file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 -c 'import tomllib; print(*tomllib.load(open("verwalter.toml", "rb"))["packages"]["livekit-ffi"]["release"]["required_assets"], sep="\n")' > "$RUNNER_TEMP/required.txt"
          gh release view "$TAG" --json isDraft,assets \
            --jq 'select(.isDraft == false) | .assets[].name' > on-release.txt
          missing=0
          while read -r asset; do
            if ! grep -qxF "$asset" on-release.txt; then
              echo "::error::release ${TAG} is not public with ${asset}"
              missing=1
            fi
          done < "$RUNNER_TEMP/required.txt"
          exit "$missing"

  build-and-publish:
    name: Build & publish Dart package
    needs: resolve-tag
    if: ${{ needs.resolve-tag.outputs.published != 'true' || inputs.dry_run }}
    runs-on: ubuntu-latest
    # Names the environment in the OIDC token so pub.dev's "Require GitHub
    # Actions environment" check passes, and subjects the job to the
    # environment's deployment-tag rule. Configure that rule to allow only
    # `livekit-ffi/v*`; see the note at the top of this file.
    environment: pub.dev
    permissions:
      contents: read
      # Exchanged for a temporary pub.dev token by dart-lang/setup-dart.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build the tagged source, not the dispatch ref (which defaults to main).
          ref: ${{ needs.resolve-tag.outputs.tag_name }}
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      # Same keys as uniffi-dart-test.yml, so pushes to main keep them warm.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-dart-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-dart-

      - name: Install Common Deps for UniFFI Tasks
        uses: ./.github/actions/uniffi-deps

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          # Pinned, and kept identical to uniffi-dart-test.yml, so PR CI
          # validates the SDK the publish runs with. A floating channel could
          # introduce a new lint that fails the dry run only on release day.
          # Bump both together.
          sdk: 3.13.1

      - name: Build Dart package (release)
        working-directory: livekit-ffi
        run: cargo make --profile release dart-package

      # pub builds the publish archive from git's file listing, and the
      # generated packages/ tree is gitignored, so publishing from inside the
      # work tree produces an empty archive. Stage a copy outside it.
      #
      # The guard is a backstop for the dart-clean task: a package that ships
      # a local native library would shadow the hook's download mode for every
      # consumer, and pub.dev versions cannot be unpublished.
      - name: Stage package outside the work tree
        run: |
          rm -rf "$RUNNER_TEMP/livekit_ffi"
          cp -R livekit-ffi/packages/dart "$RUNNER_TEMP/livekit_ffi"
          if find "$RUNNER_TEMP/livekit_ffi" \( -name 'liblivekit_ffi.*' -o -name 'livekit_ffi.dll' \) | grep -q .; then
            echo "Staged package contains a local native library; refusing to publish." >&2
            exit 1
          fi

      - name: Validate package
        working-directory: ${{ runner.temp }}/livekit_ffi
        run: |
          dart pub get
          dart pub publish --dry-run

      - name: Publish to pub.dev
        if: ${{ env.PUBLISH_ENABLED == 'true' && !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/livekit_ffi
        run: dart pub publish --force

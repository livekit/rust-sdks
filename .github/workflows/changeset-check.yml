name: Changeset Check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Trusted publishing cannot create a new crate (see release.yml). This check
  # runs on the release PR, which is the last gate before publication.
  check-crates-published:
    name: Check crates exist on crates.io
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: .github/scripts/check_crates_published.sh

  # Fails a PR that changes a package of verwalter.toml without a changeset.
  # The `internal` label exempts a PR. The release PR is exempt by its branch.
  check-changeset:
    name: Check for changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: livekit/verwalter@359985c1e5567b17ae84db0241fbb305c383f89e # v0.30.0
        with:
          command: check

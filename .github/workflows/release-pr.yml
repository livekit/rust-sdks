# Keeps one release PR open while changesets are pending. Each push to main
# regenerates the `release/main` branch from main. Merging that PR starts
# release.yml.
name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the commit that added a changeset gives its changelog line the PR and author
      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        with:
          command: pr
          # The GitHub App lets the release PR start CI. A PR that
          # github.token opens starts no workflow. release.yml accepts only
          # a PR from this App.
          app-client-id: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}

name: Test API

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Exercise every runtime backend so a regression in one (e.g. the async/isahc
  # server API silently failing to compile) is caught. Each leg pins a single
  # runtime via --no-default-features, and every leg reaches the mock server: the
  # services-* legs over HTTP, the signal-client legs over the WebSocket, selecting
  # server behaviour with the token's `lk.mock` attribute. So the service container is
  # a prerequisite for all of them, not a convenience for some.
  livekit-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services (tokio)
            cmd: cargo test -p livekit-api --no-default-features --features services-tokio,access-token --lib services::api_test -- --nocapture
          - name: services (async / isahc)
            cmd: cargo test -p livekit-api --no-default-features --features services-async,access-token --test services_async -- --nocapture
          - name: signal-client (tokio)
            cmd: cargo test -p livekit-api --no-default-features --features signal-client-tokio,access-token --lib --test signal_tokio --test signal_unreachable -- --nocapture
          - name: signal-client (async)
            cmd: cargo test -p livekit-api --no-default-features --features signal-client-async,access-token --lib --test signal_async -- --nocapture
    services:
      mock-server:
        image: livekit/test-server:latest
        ports:
          - 9999:9999
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          rustflags: ""

      - name: Install Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for mock server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9999/settings/regions >/dev/null && exit 0
            sleep 1
          done
          echo "mock server did not become ready" && exit 1

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # The runtime abstraction itself, once per backend. These are the tests that
  # make a backend cheap to validate: no server, no protoc, no libwebrtc in the
  # dependency graph, so the whole matrix runs in seconds. The `dispatcher`
  # backend had no coverage of any kind before this job.
  livekit-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime (tokio)
            cmd: cargo test -p livekit-runtime --no-default-features --features tokio
          - name: runtime (async / async-std)
            cmd: cargo test -p livekit-runtime --no-default-features --features async
          - name: runtime (dispatcher)
            cmd: cargo test -p livekit-runtime --no-default-features --features dispatcher
          # No backend feature at all: everything outside the three backend
          # modules must still compile, since that is the `set_runtime`-only build.
          - name: runtime (no backend)
            cmd: cargo check -p livekit-runtime --no-default-features
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          rustflags: ""

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # Compile guards for the consumer paths that pair a non-tokio runtime with the
  # transport layer. `TcpStream` is the one part of the old surface that stays
  # backend-specific, so it can only be checked here, not in the runtime tests.
  # The two dispatcher legs are the first CI coverage that path has ever had.
  runtime-consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: livekit-net (async)
            cmd: cargo check -p livekit-net --no-default-features --features native-async
          - name: livekit-net (dispatcher)
            cmd: cargo check -p livekit-net --no-default-features --features native-dispatcher
          - name: livekit-api signal-client (dispatcher)
            cmd: cargo check -p livekit-api --no-default-features --features signal-client-dispatcher,access-token
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          rustflags: ""

      - name: Install Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

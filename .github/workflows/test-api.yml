name: Test API

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Each leg pins its feature set via --no-default-features so a regression in a
  # narrower build (e.g. the transport-blind path silently failing to compile) is
  # caught rather than masked by workspace feature unification.
  #
  # The mock server below is load-bearing for both legs: services::api_test
  # issues Twirp requests against it and signal_tokio connects to it and expects
  # a JoinResponse. Both reach it at LK_TEST_SERVER_URL, default
  # http://127.0.0.1:9999.
  #
  # Both of those tests return early when the server is unreachable, so removing
  # the service does not fail the build — it quietly demotes these legs to a
  # compile check. Only signal_unreachable is independent of it: that one dials a
  # dead port on purpose.
  #
  # The job name stays `livekit-api` even though it now also covers
  # livekit-signaling: it is a required status check, and renaming it would break
  # branch protection.
  livekit-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services (tokio)
            cmd: cargo test -p livekit-api --no-default-features --features services,access-token --lib services::api_test -- --nocapture
          - name: livekit-signaling (tokio)
            cmd: cargo test -p livekit-signaling --no-default-features --features native --lib --test signal_tokio --test signal_unreachable -- --nocapture
    services:
      mock-server:
        image: livekit/test-server:latest
        ports:
          - 9999:9999
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Install Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for mock server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9999/settings/regions >/dev/null && exit 0
            sleep 1
          done
          echo "mock server did not become ready" && exit 1

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

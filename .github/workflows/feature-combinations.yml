# Checks that every combination of up to 2 simultaneous cargo features builds,
# across the client SDK and everything below it. Feature bugs (a `dep:` that is
# only pulled in by one feature but used unconditionally, a `?/` that silently
# no-ops) do not show up in the default-feature build, so nothing else in CI
# catches them.
#
# `--depth 2` is a deliberate ceiling: `livekit` alone goes from 67 combinations
# at depth 2 to 232 at depth 3. Depth 2 catches pairwise interactions, which is
# where nearly all feature bugs live.
#
# The target matrix mirrors builds.yml. Feature *resolution* is
# platform-independent, but what the resolved features then compile is not:
# cfg-gated code, the webrtc-sys C++ bridge, and the per-platform TLS backends
# all differ, so a combination can be fine on linux and broken on android.
# Jobs run in parallel, so the cost is the slowest target rather than the sum.
name: Feature Combinations (nightly, exhaustive)

on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC daily. This is the exhaustive backstop: the per-commit job in
    # feature-combinations-curated.yml checks a curated subset of livekit and
    # livekit-api, so the combinations it skips are caught here within a day.
    - cron: "0 7 * * *"

# One in-flight run per ref. This job is cheap per platform but there are
# eleven of them, so superseded pushes should not keep burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The crates under test: `livekit` and `livekit-api` plus every workspace
  # crate they depend on that has features of its own. cargo-hack only varies
  # the features of the packages named with -p, so dependencies have to be
  # listed explicitly to get their own powersets. 209 combinations in total.
  HACK_PACKAGES: >-
    -p livekit
    -p livekit-api
    -p livekit-signaling
    -p livekit-net
    -p livekit-region
    -p livekit-protocol
    -p livekit-datatrack
    -p livekit-data-stream
    -p livekit-common
    -p libwebrtc
    -p webrtc-sys
    -p livekit-token

jobs:
  feature-powerset:
    strategy:
      # Every target reports independently; one broken platform should not hide
      # the state of the other ten.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
          - os: macos-latest
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # `native-tls` means openssl-sys on Android, and there is no Android
          # OpenSSL to link against — the build script fails with "Could not
          # find directory of OpenSSL installation" for every combination that
          # enables it. This is not a feature-wiring bug: Android is a
          # rustls-only platform here, and ffi-builds.yml already ships all
          # three Android targets as `rustls-tls-webpki-roots`. Excluding the
          # feature drops 209 combinations to 172 and keeps
          # `native-tls-vendored` (which builds OpenSSL from source) covered.
          - os: ubuntu-latest
            target: aarch64-linux-android
            exclude_features: native-tls
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            exclude_features: native-tls
          - os: ubuntu-latest
            target: x86_64-linux-android
            exclude_features: native-tls

    name: Feature powerset nightly (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Measured at ~14 min end to end for aarch64-unknown-linux-gnu. Set well
    # above that to leave room, not as a target.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Install Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install linux dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt update -y
          # lld is needed on aarch64 because GNU ld cannot link libwebrtc.a.
          sudo apt install -y \
            lld \
            libasound2-dev \
            libssl-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxext-dev \
            libdrm-dev \
            libgbm-dev \
            libxfixes-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libglib2.0-dev

      # Ubuntu 24 ships clang 18; webrtc-sys needs 21+ for libwebrtc's hermetic
      # libc++. Android is excluded: cargo-ndk supplies its own NDK clang.
      - name: Install clang for webrtc-sys
        if: ${{ contains(matrix.target, 'unknown-linux-gnu') }}
        run: .github/scripts/install-clang.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Install cargo-hack
        # Pinned rather than floating: cargo-hack decides which combinations
        # exist, so an unpinned bump would silently change what this job tests.
        run: cargo install cargo-hack --locked --version 0.6.45

      - name: Install cargo-ndk
        if: ${{ contains(matrix.target, 'android') }}
        run: cargo install cargo-ndk --locked

      # Android needs the NDK's clang to compile the webrtc-sys C++ bridge, and
      # cargo-ndk is what puts it (and the right sysroot) in the environment.
      # It execs `cargo <args>`, so it wraps `hack` the same way it wraps
      # `build`, and supplies --target itself.
      - name: Resolve cargo driver for this target
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *android* ]]; then
            echo "CHECK_CMD=cargo ndk --target ${{ matrix.target }} check" >> "$GITHUB_ENV"
            echo "HACK_CMD=cargo ndk --target ${{ matrix.target }} hack"   >> "$GITHUB_ENV"
          else
            echo "CHECK_CMD=cargo check --target ${{ matrix.target }}" >> "$GITHUB_ENV"
            echo "HACK_CMD=cargo hack --target ${{ matrix.target }}"   >> "$GITHUB_ENV"
          fi

      # Only crates.io sources are cached, deliberately not `target/`. This job
      # exists to report the cost of checking the feature powerset from cold; a
      # warm target dir would make the number look better than a real first run.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-

      # Baseline for comparison: one plain check of the same crates at their
      # default features. This is what the powerset step should be measured
      # against — it absorbs the one-time costs (libwebrtc download, the
      # webrtc-sys C++ bridge) that the powerset step then does not repeat.
      - name: Baseline check (default features)
        shell: bash
        run: |
          start=$(date +%s)
          $CHECK_CMD $HACK_PACKAGES
          echo "BASELINE_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Check feature powerset (depth 2)
        shell: bash
        run: |
          start=$(date +%s)
          # --keep-going reports every broken combination in one run instead of
          # aborting at the first, so a red build is one round of fixes.
          $HACK_CMD $HACK_PACKAGES \
            --feature-powerset \
            --depth 2 \
            --keep-going \
            ${{ matrix.exclude_features && format('--exclude-features {0}', matrix.exclude_features) || '' }} \
            check
          echo "POWERSET_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # livekit-ffi and livekit-uniffi are checked here rather than per-commit:
      # their combinations cost 103s of a 345s budget (each TLS change rebuilds
      # livekit underneath livekit-ffi), which is what pushed the per-commit job
      # over the line. Nightly is the right place for them.
      - name: livekit-ffi / livekit-uniffi feature combinations
        shell: bash
        run: |
          set -uo pipefail
          COMBOS=$(cat <<'EOF'
          livekit-ffi|
          livekit-ffi|--no-default-features --features native-tls
          livekit-ffi|--no-default-features --features native-tls-vendored
          livekit-ffi|--no-default-features --features rustls-tls-webpki-roots
          livekit-ffi|--no-default-features --features rustls-tls-native-roots
          livekit-ffi|--features tracing
          livekit-uniffi|
          livekit-uniffi|--features cli
          EOF
          )
          failed=0
          while IFS='|' read -r crate flags; do
            [[ -z "${crate// /}" || "$crate" =~ ^[[:space:]]*# ]] && continue
            crate="${crate// /}"
            # Android has no OpenSSL to link: skip bare `native-tls`.
            if [ -n "${{ matrix.exclude_features || '' }}" ] \
               && printf '%s' "$flags" | grep -qE '(^|[ ,])native-tls($|[ ,])'; then
              echo "::notice::skipping (no Android OpenSSL): $crate $flags"
              continue
            fi
            echo "::group::$crate $flags"
            $CHECK_CMD -p "$crate" $flags || { failed=$((failed+1)); echo "::error::failed: $crate $flags"; }
            echo "::endgroup::"
          done <<< "$COMBOS"
          [ "$failed" -eq 0 ]

      - name: Report timings
        # Runs even when the powerset fails so the timing is still reported;
        # POWERSET_SECS is then unset and shown as n/a.
        if: always()
        shell: bash
        run: |
          secs() { if [ -n "${1:-}" ]; then echo "${1}s"; else echo "n/a"; fi; }
          {
            echo "### Feature powerset timing — \`${{ matrix.target }}\`"
            echo ""
            echo "| Measurement | Value |"
            echo "| --- | --- |"
            echo "| Baseline \`cargo check\` (default features) | $(secs "${BASELINE_SECS:-}") |"
            echo "| Feature powerset, depth 2 | $(secs "${POWERSET_SECS:-}") |"
            if [ -n "${BASELINE_SECS:-}" ] && [ -n "${POWERSET_SECS:-}" ] && [ "$BASELINE_SECS" -gt 0 ]; then
              awk -v p="$POWERSET_SECS" -v b="$BASELINE_SECS" \
                'BEGIN { printf "| Powerset as a multiple of baseline | %.1fx |\n", p/b
                         printf "| Powerset wall time | %.1f min |\n", p/60 }'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

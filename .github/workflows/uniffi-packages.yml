name: UniFFI packages

# Publishes the per-language livekit-ffi core-modules wrapper packages (Swift
# xcframework → livekit/livekit-ffi-xcframework; Android AAR → Maven
# Central) for a livekit-ffi release.
#
# Trigger note: release.yml calls this workflow as a job once the livekit-ffi
# release is public with its files. A run therefore implies a green build of
# every target, and a failure here makes the release run red. For a run by
# hand, dispatch this workflow with `tag_name`.
#
# The Dart package, and the cdylib release assets its build hook downloads, are
# handled by release.yml: it builds those assets before the tag exists, and
# dispatches uniffi-dart-publish.yml at the tag (pub.dev requires a run whose
# ref is the tag).

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build artifacts but skip publishing."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build artifacts but skip publishing."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get-tag.outputs.tag_name }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - id: get-tag
        # Tags are bound through env rather than template-expanded into the
        # script: tag names may contain shell metacharacters (Actions script
        # injection).
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          case "$TAG" in
            livekit-ffi/v*) ;;
            *) echo "::error::unexpected tag: $TAG"; exit 1 ;;
          esac
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          # Strip the "livekit-ffi/v" prefix to get the package version (e.g. 0.13.0).
          echo "version=${TAG#livekit-ffi/v}" >> "$GITHUB_OUTPUT"

  swift:
    needs: resolve-tag
    uses: ./.github/workflows/uniffi-swift.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      UNIFFI_XCFRAMEWORK_PAT: ${{ secrets.UNIFFI_XCFRAMEWORK_PAT }}

  android:
    needs: resolve-tag
    uses: ./.github/workflows/uniffi-android.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

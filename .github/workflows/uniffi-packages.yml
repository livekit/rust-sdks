name: UniFFI packages

# Publishes the per-language livekit-ffi core-modules wrapper packages (Swift
# xcframework → livekit/livekit-ffi-xcframework; Android AAR → Maven
# Central) for a livekit-ffi release.
#
# Trigger note: ffi-builds.yml calls this workflow as a job once its build
# matrix is green and the release is public. A run therefore implies a green
# 11-target build, and a failure here makes the release run red. There is no
# tag-push trigger, on purpose: the tag exists before the FFI build, so a push
# trigger would publish before that build is green. For a run by hand,
# dispatch this workflow with `tag_name`.
#
# The Dart package, and the cdylib release assets its build hook downloads, are
# handled by uniffi-dart-publish.yml, which ffi-builds.yml dispatches at the tag
# (pub.dev requires a run whose ref is the tag) and builds those assets
# itself so publishing can depend on them directly.

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build artifacts but skip publishing."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build artifacts but skip publishing."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get-tag.outputs.tag_name }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - id: get-tag
        # Tags are bound through env rather than template-expanded into the
        # script: tag names may contain shell metacharacters (Actions script
        # injection).
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          case "$TAG" in
            livekit-ffi/v*) ;;
            *) echo "::error::unexpected tag: $TAG"; exit 1 ;;
          esac
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          # Strip the "livekit-ffi/v" prefix to get the package version (e.g. 0.13.0).
          echo "version=${TAG#livekit-ffi/v}" >> "$GITHUB_OUTPUT"

  swift:
    needs: resolve-tag
    uses: ./.github/workflows/uniffi-swift.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      UNIFFI_XCFRAMEWORK_PAT: ${{ secrets.UNIFFI_XCFRAMEWORK_PAT }}

  android:
    needs: resolve-tag
    uses: ./.github/workflows/uniffi-android.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

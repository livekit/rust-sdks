name: UniFFI packages

# Publishes the per-language livekit-ffi core-modules wrapper packages (Swift
# xcframework → livekit/livekit-uniffi-xcframework; Android AAR → Maven
# Central) when a livekit-ffi release tag is pushed.
#
# Trigger note: this used to react to `release: published`, which worked only
# because knope-bot (a GitHub App) published the livekit-uniffi release and its
# tag directly. livekit-ffi uses knope's `assets = "marker"` draft flow, and a
# draft carries no tag until it is published — with GITHUB_TOKEN, which never
# starts a workflow run (see #1256). So the trigger is the git tag that
# ffi-builds.yml creates with the livekit-repo-writer App after its build
# matrix succeeds and before it publishes the draft. A tag push therefore still
# implies a green 11-target build, the same guarantee the release event gave.
#
# The Dart package, and the cdylib release assets its build hook downloads, are
# handled by uniffi-dart-publish.yml, which reacts to the same tag push
# (pub.dev requires a tag-push-triggered workflow) and builds those assets
# itself so publishing can depend on them directly.

on:
  push:
    tags: ["livekit-ffi/v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. livekit-ffi/v0.13.0)"
        required: true
        type: string
      dry_run:
        description: "Build artifacts but skip publishing."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get-tag.outputs.tag_name }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - id: get-tag
        # Tags are bound through env rather than template-expanded into the
        # script: tag names may contain shell metacharacters (Actions script
        # injection).
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$PUSHED_TAG}"
          case "$TAG" in
            livekit-ffi/v*) ;;
            *) echo "::error::unexpected tag: $TAG"; exit 1 ;;
          esac
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          # Strip the "livekit-ffi/v" prefix to get the package version (e.g. 0.13.0).
          echo "version=${TAG#livekit-ffi/v}" >> "$GITHUB_OUTPUT"

  swift:
    needs: resolve-tag
    uses: ./.github/workflows/uniffi-swift.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      UNIFFI_XCFRAMEWORK_PAT: ${{ secrets.UNIFFI_XCFRAMEWORK_PAT }}

  android:
    needs: resolve-tag
    uses: ./.github/workflows/uniffi-android.yml
    with:
      version: ${{ needs.resolve-tag.outputs.version }}
      tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

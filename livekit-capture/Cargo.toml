[package]
name = "livekit-capture"
description = "Encoded video ingest helpers for LiveKit"
version = "0.1.0"
readme = "README.md"
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
base64 = { version = "0.22", optional = true }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
gstreamer = { version = "0.25.2", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
# Test-only (`__test-source-rtsp`); in `[dependencies]` because Cargo has no
# optional dev-dependencies.
gio = { version = "0.22", optional = true }
gstreamer-rtsp = { version = "0.25", optional = true }
gstreamer-rtsp-server = { version = "0.25", optional = true }
http-auth = { version = "0.1", optional = true }
rtsp-types = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true }
sdp-types = { version = "0.2", optional = true }
url = { version = "2", optional = true }
livekit = { workspace = true }
log = { workspace = true }
pollster = { version = "0.4", optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
wgpu = { workspace = true, optional = true }
yuv-sys = { workspace = true, features = ["jpeg"], optional = true }

[dev-dependencies]
log = { workspace = true }
rcgen = "0.13"
test-log = "0.2"
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[features]
default = []
serde = ["dep:serde"]
schemars = ["dep:schemars", "serde"]

# Async convenience wrappers for blocking source construction when using
# a tokio runtime.
tokio = ["tokio/rt"]

# Pixel sources
source-clock = ["dep:chrono", "dep:pollster", "dep:wgpu", "dep:yuv-sys"]
source-device = [
    "dep:yuv-sys",
    # macOS backend
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-av-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-foundation",
    "objc2-av-foundation/AVCaptureDevice",
    "objc2-av-foundation/AVCaptureInput",
    "objc2-av-foundation/AVCaptureOutputBase",
    "objc2-av-foundation/AVCaptureSession",
    "objc2-av-foundation/AVCaptureSessionPreset",
    "objc2-av-foundation/AVCaptureVideoDataOutput",
    "objc2-av-foundation/AVMediaFormat",
    "objc2-av-foundation/AVVideoSettings",
    "objc2-av-foundation/dispatch2",
    "objc2-av-foundation/objc2-core-media",
    "objc2-core-media/CMFormatDescription",
    "objc2-core-media/CMSync",
    "objc2-core-media/CMTime",
    "objc2-core-media/CMSampleBuffer",
    "objc2-core-media/objc2-core-video",
    "objc2-core-video/CVBase",
    "objc2-core-video/CVBuffer",
    "objc2-core-video/CVImageBuffer",
    "objc2-core-video/CVPixelBuffer",
    "objc2-core-video/CVReturn",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSObject",
    "objc2-foundation/NSValue",
    "objc2-foundation/NSString",
    "objc2-foundation/objc2-core-foundation",
]
source-pattern = ["dep:pollster", "dep:wgpu", "dep:yuv-sys"]

# Encoded sources
source-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
source-rtsp = ["dep:base64", "dep:http-auth", "dep:rtsp-types", "dep:sdp-types", "dep:url"]
# Adds `rtsps://` (RTSP over TLS, 1.2+) support to the RTSP source.
# Certificates are verified against the system roots by default.
source-rtsp-tls = ["source-rtsp", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types"]

# Testing
# In-process RTSP server for `tests/source_rtsp_test.rs`. Requires the
# system GStreamer RTSP server library. Test-only; not part of the public
# API.
__test-source-rtsp = [
    "source-rtsp",
    "source-rtsp-tls",
    "dep:gio",
    "dep:gstreamer",
    "dep:gstreamer-rtsp",
    "dep:gstreamer-rtsp-server",
]

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"], optional = true }
objc2 = { version = "0.6.4", default-features = false, features = ["std"], optional = true }
objc2-av-foundation = { version = "0.3.2", default-features = false, optional = true }
objc2-core-media = { version = "0.3.2", default-features = false, optional = true }
objc2-core-video = { version = "0.3.2", default-features = false, optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"], optional = true }

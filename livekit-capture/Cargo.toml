[package]
name = "livekit-capture"
description = "Encoded video ingest helpers for LiveKit"
version = "0.1.0"
readme = "README.md"
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
gstreamer = { version = "0.25.2", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
livekit = { workspace = true }
log = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[features]
default = ["demo", "gstreamer"] # TODO: Remove after testing

# Async source constructors (`new`), which run blocking construction and
# stream discovery on the tokio blocking pool. Without this feature only the
# `new_blocking` constructors are available.
tokio = ["tokio/rt"]

# Serde derives on the source configuration types, for applications that
# build sources from a configuration file rather than from code.
serde = ["dep:serde"]

# JSON Schema derives on the same types. The schema is generated from the
# serde attributes, so it would not describe the wire format without them.
schemars = ["dep:schemars", "serde"]

# Pixel sources
demo = []

# Encoded sources
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

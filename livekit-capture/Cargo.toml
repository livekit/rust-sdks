[package]
name = "livekit-capture"
description = "Encoded video ingest helpers for LiveKit"
version = "0.1.0"
readme = "README.md"
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
gstreamer = { version = "0.25.2", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
livekit = { workspace = true }
log = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[features]
default = ["demo", "gstreamer"] # TODO: Remove after testing
serde = ["dep:serde"]
schemars = ["dep:schemars", "serde"]

# Async convenience wrappers for blocking source construction when using
# a tokio runtime.
tokio = ["tokio/rt"]

# Pixel sources
demo = []

# Encoded sources
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

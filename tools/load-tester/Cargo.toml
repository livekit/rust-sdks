[package]
name = "load-tester"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ramps participants into a LiveKit room and scores audio and video quality from WebRTC stats"
publish = false

[dependencies]
livekit = { workspace = true, features = ["rustls-tls-native-roots"] }
livekit-token = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
libc = "0.2"

[package.metadata.feature-combinations]
mode = "powerset"

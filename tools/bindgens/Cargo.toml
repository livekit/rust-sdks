[package]
name = "bindgens"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Foreign-binding generator CLIs for the LiveKit Rust crates"
publish = false

# Tooling crate: each bin is a code-generation CLI shared across the workspace's
# uniffi-exposing crates (livekit-ffi, ...). It has no library target beyond
# these bins — they read metadata from an already-compiled cdylib via
# `--library`, so they never depend on the crates they generate for.
[dependencies]
uniffi = { workspace = true, features = ["cli"] }
# Dart binding generator. Not published to crates.io, so pinned by git rev. The
# rev must target the same uniffi-rs release (0.31) as the `uniffi` dependency
# above, or it cannot read the compiled metadata.
#
# Pinned to upstream main rather than a release: the newest release
# (v0.2.1+v0.31.2) predates the three fixes this needs -- custom types leaking
# into FFI signatures (#154), object converter statics colliding with Rust
# methods named `write` (#156), and each crate re-declaring the runtime
# scaffolding, which kept livekit-datatrack's types from crossing over (#150).
# Move to a version requirement once a release carries them.
uniffi-dart = { git = "https://github.com/Uniffi-Dart/uniffi-dart", rev = "67547701d849c9ef6302f79bb2189bb6075f69fa", optional = true }
camino = { version = "1", optional = true }

# `default-features = false` is load-bearing, not tidiness. ubrn's `wasm` feature
# pulls `wasm-bindgen-cli-support`, which pins the wasm-bindgen family to its own
# exact version — unsatisfiable against the `wasm-bindgen` this workspace resolves
# through `livekit -> libwebrtc`, since those crates cross-pin with `=`.
#
# Pinned by commit rather than branch or tag: this is the released line's `main`,
# which carries #453 — without it a non-wasm build silently generates JSI bindings
# instead of NAPI, exit 0 and no warning. There is no tag past 0.31.0-5 containing
# that fix yet; move to one when it ships. A `rev` keeps `cargo update` from
# sweeping the generator forward on its own, since what it emits has to stay in
# step with the @ubjs/* runtime UBRN_VERSION names.
uniffi-bindgen-react-native = { git = "https://github.com/jhugman/uniffi-bindgen-react-native", rev = "e8be09d125ad260bb46715f46e49667201326a81", default-features = false }
clap = { version = "4", features = ["derive"] }

[features]
# Enables the `uniffi-bindgen-dart` bin. Off by default so a plain
# `cargo build --workspace` does not fetch or compile the git dependency.
dart-bindgen = ["dep:uniffi-dart", "dep:camino"]

[[bin]]
name = "uniffi-bindgen-dart"
path = "src/bin/uniffi-bindgen-dart.rs"
required-features = ["dart-bindgen"]

[package]
name = "livekit-session"
description = "Agent sessions for the LiveKit Rust SDK"
version = "0.1.0"
license.workspace = true
edition.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["native"]

# Backend and TLS pass-throughs, forwarded to both the room connection
# (livekit) and the token fetch (livekit-token-source).
native = ["livekit/native", "livekit-token-source/native"]
native-tls = ["livekit/native-tls", "livekit-token-source/native-tls"]
native-tls-vendored = ["livekit/native-tls-vendored", "livekit-token-source/native-tls-vendored"]
rustls-tls-native-roots = [
    "livekit/rustls-tls-native-roots",
    "livekit-token-source/rustls-tls-native-roots",
]
rustls-tls-webpki-roots = [
    "livekit/rustls-tls-webpki-roots",
    "livekit-token-source/rustls-tls-webpki-roots",
]

# End-to-end tests against a running `livekit-server --dev`.
__lk-e2e-test = []

# How CI checks this crate's features, read by
# `.github/workflows/feature-combinations-curated.yml` via `cargo metadata`.
# See the equivalent table in `livekit/Cargo.toml` for the encoding.
#
# Curated rather than a powerset: every TLS feature is forwarded to `livekit`,
# so most powerset entries rebuild `livekit` underneath, and depth 2 would
# spend 22 checks mostly on two TLS backends at once or `__lk-e2e-test` paired
# with something unrelated, which nobody can select. The TLS forwards
# themselves are covered by `livekit`'s own list.
[package.metadata.feature-combinations]
mode = "curated"
check = [
    ["default"],                                        # a plain `cargo check`
    [],                                                 # --no-default-features
    ["native", "rustls-tls-webpki-roots"],
    ["default", "rustls-tls-native-roots"],             # defaults *plus* one
]

[dependencies]
chrono = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
livekit = { workspace = true }
livekit-token-source = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
livekit-api = { workspace = true }
livekit-protocol = { workspace = true }
livekit-token = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
